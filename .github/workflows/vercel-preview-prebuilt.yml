name: Vercel Prebuilt Preview Deployments

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  detect-affected-projects:
    name: Detect affected Vercel projects
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_projects: ${{ steps.select.outputs.has_projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Select affected Vercel projects
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/select-vercel-preview-projects.mjs "$BASE_SHA" "$HEAD_SHA"

  deploy-preview:
    name: Preview (${{ matrix.app }})
    needs: detect-affected-projects
    if: needs.detect-affected-projects.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-affected-projects.outputs.matrix) }}
    concurrency:
      group: vercel-preview-${{ github.event.pull_request.number }}-${{ matrix.app }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: team_VbdXYd5XY8pvEMjsWODHQhgD
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
      VERCEL_ENV: preview
      VERCEL_GIT_PROVIDER: github
      VERCEL_GIT_REPO_OWNER: deessejs
      VERCEL_GIT_REPO_SLUG: deessejs
      VERCEL_GIT_COMMIT_REF: ${{ github.event.pull_request.head.ref }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      VERCEL_GIT_PULL_REQUEST_ID: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@64.7.0

      - name: Pull preview environment and project settings
        run: vercel pull --yes --environment=preview --git-branch="$GITHUB_HEAD_REF"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build preview from the monorepo root
        run: vercel build

      - name: Deploy prebuilt preview
        run: |
          deployment_url="$(vercel deploy --prebuilt --yes)"
          printf 'Preview deployment: %s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
