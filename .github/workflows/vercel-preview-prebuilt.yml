name: Vercel Prebuilt Preview Deployments

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  detect-affected-projects:
    name: Detect affected Vercel projects
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_projects: ${{ steps.select.outputs.has_projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Select affected Vercel projects
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/select-vercel-preview-projects.mjs "$BASE_SHA" "$HEAD_SHA"

  build-preview:
    name: Build preview (${{ matrix.app }})
    needs: detect-affected-projects
    if: needs.detect-affected-projects.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-affected-projects.outputs.matrix) }}
    concurrency:
      group: vercel-preview-build-${{ github.event.pull_request.number }}-${{ matrix.app }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: team_VbdXYd5XY8pvEMjsWODHQhgD
      VERCEL_PROJECT_ID: ${{ fromJSON('{"docs":"prj_TjmKPgxU8po3FDjQVkprdIRGgXa4","agent":"prj_XpSk71L2P6VCrZNA1P34hlTIWajc","web":"prj_EDu0GMa3fKaInW6f3MBiLCiewi6O","app":"prj_IOf5cRl1rkbc6SfSMzLsKsneYPdb"}')[matrix.app] }}
      VERCEL_PROJECT_ROOT: ${{ fromJSON('{"docs":"apps/docs","agent":"apps/agent","web":"apps/web","app":"apps/app"}')[matrix.app] }}
      VERCEL_ENV: preview
      VERCEL_GIT_PROVIDER: github
      VERCEL_GIT_REPO_OWNER: deessejs
      VERCEL_GIT_REPO_SLUG: deessejs
      VERCEL_GIT_COMMIT_REF: ${{ github.event.pull_request.head.ref }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      VERCEL_GIT_PULL_REQUEST_ID: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@64.7.0

      # The token is scoped to this step, which runs before PR-controlled build code.
      - name: Pull preview environment and project settings
        run: vercel pull --yes --environment=preview --git-branch="$GITHUB_HEAD_REF"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Keep the trusted project link separate from the PR-controlled output.
      - name: Upload Vercel project link
        uses: actions/upload-artifact@v7
        with:
          name: vercel-project-${{ github.event.pull_request.number }}-${{ matrix.app }}
          path: .vercel/project.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Build preview from the monorepo root
        run: vercel build

      - name: Run local Playwright suite
        if: matrix.app == 'web'
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web test:e2e:local
        env:
          CI: "1"

      - name: Upload Playwright diagnostics
        if: failure() && matrix.app == 'web'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            apps/web/playwright-report/
            apps/web/tests/e2e/test-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Checkout trusted prebuilt context packager
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .trusted-tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Package traced files required by prebuilt deployment
        run: node .trusted-tools/.github/scripts/package-vercel-prebuilt-context.mjs

      - name: Upload traced prebuilt context
        uses: actions/upload-artifact@v7
        with:
          name: vercel-context-${{ github.event.pull_request.number }}-${{ matrix.app }}
          path: .vercel/prebuilt-context.tar.gz
          # The archive is under .vercel; upload-artifact excludes hidden paths by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload prebuilt output
        uses: actions/upload-artifact@v7
        with:
          name: vercel-output-${{ github.event.pull_request.number }}-${{ matrix.app }}
          path: |
            .vercel/output
            !.vercel/output/**/.env*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    name: Deploy preview (${{ matrix.app }})
    needs: [detect-affected-projects, build-preview]
    if: needs.detect-affected-projects.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-affected-projects.outputs.matrix) }}
    concurrency:
      group: vercel-preview-deploy-${{ github.event.pull_request.number }}-${{ matrix.app }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: team_VbdXYd5XY8pvEMjsWODHQhgD
      VERCEL_PROJECT_ID: ${{ fromJSON('{"docs":"prj_TjmKPgxU8po3FDjQVkprdIRGgXa4","agent":"prj_XpSk71L2P6VCrZNA1P34hlTIWajc","web":"prj_EDu0GMa3fKaInW6f3MBiLCiewi6O","app":"prj_IOf5cRl1rkbc6SfSMzLsKsneYPdb"}')[matrix.app] }}
      VERCEL_ENV: preview
      VERCEL_GIT_PROVIDER: github
      VERCEL_GIT_REPO_OWNER: deessejs
      VERCEL_GIT_REPO_SLUG: deessejs
      VERCEL_GIT_COMMIT_REF: ${{ github.event.pull_request.head.ref }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      VERCEL_GIT_PULL_REQUEST_ID: ${{ github.event.pull_request.number }}
    steps:
      # A clean runner deploys the artifact; it never checks out PR code.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@64.7.0

      - name: Download trusted Vercel project link
        uses: actions/download-artifact@v8
        with:
          name: vercel-project-${{ github.event.pull_request.number }}-${{ matrix.app }}
          path: .vercel

      - name: Download prebuilt output
        uses: actions/download-artifact@v8
        with:
          name: vercel-output-${{ github.event.pull_request.number }}-${{ matrix.app }}
          path: .vercel/output

      - name: Download traced prebuilt context
        uses: actions/download-artifact@v8
        with:
          name: vercel-context-${{ github.event.pull_request.number }}-${{ matrix.app }}
          path: .

      # The clean deploy runner intentionally does not check out PR source.
      # Restore the trusted archive of project-root files packaged by the build job.
      - name: Restore traced files and verify Next runtime
        env:
          APP: ${{ matrix.app }}
          PROJECT_ROOT: ${{ fromJSON('{"docs":"apps/docs","agent":"apps/agent","web":"apps/web","app":"apps/app"}')[matrix.app] }}
        run: |
          set -euo pipefail
          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "::error::Unknown Vercel project root."
            exit 1
          fi
          if [[ ! -f prebuilt-context.tar.gz ]]; then
            echo "::error::The traced prebuilt context artifact was not downloaded."
            exit 1
          fi
          mkdir -p -- "$PROJECT_ROOT"
          tar --list --gzip --file=prebuilt-context.tar.gz >/dev/null
          tar --extract --gzip --file=prebuilt-context.tar.gz --directory=. --no-same-owner --no-same-permissions

          if [[ "$APP" == "app" || "$APP" == "web" ]]; then
            runtime_file="$PROJECT_ROOT/node_modules/next/dist/build/adapter/setup-node-env.external.js"
            if [[ ! -f "$runtime_file" ]]; then
              echo "::error::Prebuilt context is missing $runtime_file"
              exit 1
            fi
          fi

      - name: Deploy prebuilt preview
        run: |
          deployment_url="$(vercel deploy --prebuilt --yes)"
          printf 'Preview deployment: %s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
