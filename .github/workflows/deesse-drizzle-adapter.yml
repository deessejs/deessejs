name: Deesse PostgreSQL adapter

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/deesse/**"
      - "apps/deesse-drizzle-adapter/**"
      - ".github/workflows/deesse-drizzle-adapter.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL adapter integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: deesse_adapter_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deesse_adapter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/deesse_adapter_test
      BETTER_AUTH_SECRET: local-test-secret-must-be-at-least-32-bytes
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test --filter=@deessejs/drizzle-adapter
