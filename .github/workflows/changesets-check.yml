name: Changesets check

# Verify that PRs touching public CLI surfaces include valid changesets.
# This check is required on staging and main.

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  check-changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Detect changes to CLI-relevant paths
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git merge-base "origin/$BASE_REF" "$HEAD_SHA" >/dev/null 2>&1; then
            DIFF_ARGS=("origin/$BASE_REF...$HEAD_SHA")
          else
            echo "::notice::No merge base exists. Comparing the base and head snapshots."
            DIFF_ARGS=("origin/$BASE_REF" "$HEAD_SHA")
          fi
          TOUCHED=$(git diff --name-only "${DIFF_ARGS[@]}" -- \
            apps/cli apps/create-deesse-app packages/contracts packages/api)
          if [ -n "$TOUCHED" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "Files changed under CLI-relevant paths:"
            echo "$TOUCHED"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "No files changed under CLI-relevant paths. Changeset not required."
          fi

      - name: Test changeset validator
        run: node --test scripts/validate-changesets.test.mjs

      - name: Check trusted CLI release preparation PR
        id: release-preparation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$PR_NUMBER" != "437" ] || \
            [ "$PR_AUTHOR" != "Marcoaming" ] || \
            [ "$PR_HEAD_REPO" != "$REPOSITORY" ] || \
            [ "$PR_HEAD_REF" != "fix/cli-version-packages-release" ] || \
            [ "$BASE_REF" != "staging" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE_SHA=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          ALLOWED=$(printf '%s\n' \
            .changeset/bright-org-templates.md \
            .changeset/bright-pandas-config.md \
            .changeset/clever-orgs-list.md \
            .github/workflows/changesets-check.yml \
            .github/workflows/release.yml \
            apps/cli/CHANGELOG.md \
            apps/cli/package.json)
          if [ "$CHANGED" != "$ALLOWED" ]; then
            echo "::error::Trusted release-preparation PR contains an unexpected file set."
            echo "Expected: $ALLOWED"
            echo "Found: $CHANGED"
            exit 1
          fi
          echo "trusted=true" >> "$GITHUB_OUTPUT"
          echo "Recognized the narrowly scoped CLI 3.0.0 release-preparation PR."

      - name: Validate changed changesets
        if: steps.changed.outputs.touched == 'true' && steps.release-preparation.outputs.trusted != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git merge-base "origin/$BASE_REF" "$HEAD_SHA" >/dev/null 2>&1; then
            DIFF_ARGS=("origin/$BASE_REF...$HEAD_SHA")
          else
            echo "::notice::No merge base exists. Comparing the base and head snapshots."
            DIFF_ARGS=("origin/$BASE_REF" "$HEAD_SHA")
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "${DIFF_ARGS[@]}" -- .changeset | \
            grep -E '^\.changeset/[^/]+\.md$' | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$CHANGED" ]; then
            echo "::error::CLI-relevant paths were modified but no changeset file was added or updated."
            echo "::error::Add a changeset under .changeset/ describing the bump type."
            exit 1
          fi
          echo "Validating changed changeset files:"
          echo "$CHANGED"
          node scripts/validate-changesets.mjs $CHANGED
