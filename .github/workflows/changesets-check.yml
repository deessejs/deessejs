name: Changesets check

# Verify that PRs touching public CLI surfaces include valid changesets.
# This check is required on staging and main.

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  check-changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Detect changes to CLI-relevant paths
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          TOUCHED=$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA" -- \
            apps/cli apps/create-deesse-app packages/contracts packages/api)
          if [ -n "$TOUCHED" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "Files changed under CLI-relevant paths:"
            echo "$TOUCHED"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "No files changed under CLI-relevant paths. Changeset not required."
          fi

      - name: Test changeset validator
        run: node --test scripts/validate-changesets.test.mjs

      - name: Validate changed changesets
        if: steps.changed.outputs.touched == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA" -- .changeset | \
            grep -E '^\.changeset/[^/]+\.md$' | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$CHANGED" ]; then
            echo "::error::CLI-relevant paths were modified but no changeset file was added or updated."
            echo "::error::Add a changeset under .changeset/ describing the bump type."
            exit 1
          fi
          echo "Validating changed changeset files:"
          echo "$CHANGED"
          node scripts/validate-changesets.mjs $CHANGED
