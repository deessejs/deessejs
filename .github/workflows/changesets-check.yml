name: Changesets check

# Verify that PRs touching the CLI and already-established public npm
# packages include valid changesets. The PR that first adds a package sets
# its initial version directly and does not need a follow-up version bump.

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  check-changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Detect changes to public package surfaces
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git merge-base "origin/$BASE_REF" "$HEAD_SHA" >/dev/null 2>&1; then
            DIFF_ARGS=("origin/$BASE_REF...$HEAD_SHA")
          else
            echo "::notice::No merge base exists. Comparing the base and head snapshots."
            DIFF_ARGS=("origin/$BASE_REF" "$HEAD_SHA")
          fi
          TOUCHED=$(git diff --name-only "${DIFF_ARGS[@]}" -- \
            apps/cli apps/create-deesse-app packages/contracts packages/api)

          # A package's initial PR records its baseline version in the new
          # package.json. Require Changesets only after that package exists
          # on the target branch, so later changes to it cannot bypass the
          # regular version gate.
          for PACKAGE_DIR in apps/deesse apps/deesse-drizzle-adapter; do
            if git cat-file -e "origin/$BASE_REF:$PACKAGE_DIR/package.json" 2>/dev/null; then
              PACKAGE_TOUCHED=$(git diff --name-only "${DIFF_ARGS[@]}" -- "$PACKAGE_DIR")
              if [ -n "$PACKAGE_TOUCHED" ]; then
                TOUCHED=$(printf '%s\n%s' "$TOUCHED" "$PACKAGE_TOUCHED")
              fi
            else
              echo "Initial package addition at $PACKAGE_DIR: source version is its baseline; no Changeset bump is required."
            fi
          done

          TOUCHED=$(printf '%s\n' "$TOUCHED" | sed '/^$/d' | sort -u)
          if [ -n "$TOUCHED" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "Files changed under public package paths:"
            echo "$TOUCHED"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "No existing public package surfaces changed. Changeset not required."
          fi

      - name: Test changeset validator
        run: node --test scripts/validate-changesets.test.mjs

      - name: Check trusted release preparation PR
        id: release-preparation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR" != "Marcoaming" ] || \
            [ "$PR_HEAD_REPO" != "$REPOSITORY" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PR_NUMBER" = "573" ] && \
            [ "$PR_HEAD_REF" = "staging" ] && \
            [ "$BASE_REF" = "main" ]; then
            PREPARATION=promotion
          elif [ "$PR_NUMBER" = "599" ] && \
            [ "$PR_HEAD_REF" = "staging" ] && \
            [ "$BASE_REF" = "main" ]; then
            PREPARATION=cli-3-4-promotion
          elif [ "$BASE_REF" = "staging" ] && \
            [ "$PR_HEAD_REF" = "chore/blog-plugin-version-prep" ]; then
            PREPARATION=blog-admin
          elif [ "$BASE_REF" = "staging" ] && \
            [ "$PR_NUMBER" = "437" ] && \
            [ "$PR_HEAD_REF" = "fix/cli-version-packages-release" ]; then
            PREPARATION=cli
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if [ "$PREPARATION" = "cli-3-4-promotion" ]; then
            # PR #599 promotes only the staging snapshot released by PR #597.
            # Allow only this validator update after that release commit so
            # unrelated staging work cannot ride the promotion exception.
            RELEASE_PREPARATION_COMMIT=ce32197aeeca09adf9d6e3a6d28677833f78ba35
            RELEASE_TAG=release/v3.4.0-canary.20261127154236.ce32197
            if ! git merge-base --is-ancestor "$RELEASE_PREPARATION_COMMIT" "$HEAD_SHA"; then
              echo "::error::The staging promotion does not contain the validated CLI 3.4.0 release-preparation commit."
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            if [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$RELEASE_PREPARATION_COMMIT" ]; then
              echo "::error::The CLI 3.4.0 canary tag does not identify the validated release-preparation commit."
              exit 1
            fi
            CHANGED_SINCE_PREPARATION=$(git diff --name-only \
              "$RELEASE_PREPARATION_COMMIT...$HEAD_SHA" | LC_ALL=C sort)
            if [ "$CHANGED_SINCE_PREPARATION" != ".github/workflows/changesets-check.yml" ]; then
              echo "::error::The CLI 3.4.0 promotion includes changes beyond the changeset validator fix."
              echo "Found: $CHANGED_SINCE_PREPARATION"
              exit 1
            fi
            node <<'NODE'
          const fs = require("node:fs")
          const expected = new Map([
            ["apps/app/package.json", ["0.1.3", "apps/app/CHANGELOG.md"]],
            ["apps/cli/package.json", ["3.4.0", "apps/cli/CHANGELOG.md"]],
            ["apps/web/package.json", ["0.1.1", "apps/web/CHANGELOG.md"]],
            ["apps/docs/package.json", ["0.0.1", "apps/docs/CHANGELOG.md"]],
            ["apps/storybook/package.json", ["0.0.1", "apps/storybook/CHANGELOG.md"]],
            ["packages/api/package.json", ["0.1.0", "packages/api/CHANGELOG.md"]],
            ["packages/database/package.json", ["0.1.0", "packages/database/CHANGELOG.md"]],
            ["packages/contracts/package.json", ["0.1.0", "packages/contracts/CHANGELOG.md"]],
            ["packages/auth/package.json", ["0.1.0", "packages/auth/CHANGELOG.md"]],
            ["packages/env/package.json", ["0.0.1", "packages/env/CHANGELOG.md"]],
            ["packages/mcp/package.json", ["0.1.0", "packages/mcp/CHANGELOG.md"]],
            ["packages/cookies/package.json", ["0.0.2", "packages/cookies/CHANGELOG.md"]],
            ["packages/analytics/package.json", ["0.0.2", "packages/analytics/CHANGELOG.md"]],
            ["packages/email/package.json", ["0.0.1", "packages/email/CHANGELOG.md"]],
            ["packages/ui/package.json", ["0.0.1", "packages/ui/CHANGELOG.md"]],
          ])
          for (const [manifest, [version, changelog]] of expected) {
            const actual = JSON.parse(fs.readFileSync(manifest, "utf8")).version
            const history = fs.readFileSync(changelog, "utf8")
            if (actual !== version || !history.includes(`## ${version}`)) {
              console.error(`The CLI 3.4.0 release-preparation artifact is missing or has an unexpected version: ${manifest}`)
              process.exitCode = 1
            }
          }
          NODE
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            echo "Recognized PR #599 as the already-versioned CLI 3.4.0 staging release promotion."
            exit 0
          fi

          if [ "$PREPARATION" = "promotion" ]; then
            # PR #573 only promotes the staging snapshot whose package versions
            # were validated and generated by merged release-preparation PR #572.
            # Limit the later staging delta to this validator fix so new package
            # work cannot ride this one-time exception into main.
            RELEASE_PREPARATION_COMMIT=47251af0bc16a56dd6689644f9ce80be130e0379
            if ! git merge-base --is-ancestor "$RELEASE_PREPARATION_COMMIT" "$HEAD_SHA"; then
              echo "::error::The staging promotion does not contain the validated release-preparation commit."
              exit 1
            fi
            CHANGED_SINCE_PREPARATION=$(git diff --name-only \
              "$RELEASE_PREPARATION_COMMIT...$HEAD_SHA" | LC_ALL=C sort)
            if [ "$CHANGED_SINCE_PREPARATION" != ".github/workflows/changesets-check.yml" ]; then
              echo "::error::The one-time release promotion includes changes beyond the changeset validator fix."
              echo "Found: $CHANGED_SINCE_PREPARATION"
              exit 1
            fi
            node <<'NODE'
          const fs = require("node:fs")
          const expected = new Map([
            ["apps/deesse/package.json", ["0.4.0", "apps/deesse/CHANGELOG.md"]],
            ["apps/deesse-drizzle-adapter/package.json", ["1.0.0", "apps/deesse-drizzle-adapter/CHANGELOG.md"]],
          ])
          for (const [manifest, [version, changelog]] of expected) {
            const actual = JSON.parse(fs.readFileSync(manifest, "utf8")).version
            const history = fs.readFileSync(changelog, "utf8")
            if (actual !== version || !history.includes(`## ${version}`)) {
              console.error(`The staging release-preparation artifact is missing or has an unexpected version: ${manifest}`)
              process.exitCode = 1
            }
          }
          NODE
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            echo "Recognized PR #573 as the already-versioned staging release promotion."
            exit 0
          fi

          BASE_SHA=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | LC_ALL=C sort)
          if [ "$PREPARATION" = "blog-admin" ]; then
            ALLOWED=$(printf '%s\n' \
              .changeset/blog-plugin.md \
              .github/workflows/changesets-check.yml \
              apps/deesse-drizzle-adapter/CHANGELOG.md \
              apps/deesse-drizzle-adapter/package.json \
              apps/deesse/CHANGELOG.md \
              apps/deesse/package.json \
              examples/next-shadcn-admin/apps/web/CHANGELOG.md \
              examples/next-shadcn-admin/apps/web/package.json \
              examples/next-shadcn-monorepo/apps/web/CHANGELOG.md \
              examples/next-shadcn-monorepo/apps/web/package.json | LC_ALL=C sort)
          else
            ALLOWED=$(printf '%s\n' \
              .changeset/bright-org-templates.md \
              .changeset/bright-pandas-config.md \
              .changeset/clever-orgs-list.md \
              .github/workflows/changesets-check.yml \
              .github/workflows/release.yml \
              apps/cli/CHANGELOG.md \
              apps/cli/package.json | LC_ALL=C sort)
          fi
          if [ "$CHANGED" != "$ALLOWED" ]; then
            echo "::error::Trusted release-preparation PR contains an unexpected file set."
            echo "Expected: $ALLOWED"
            echo "Found: $CHANGED"
            exit 1
          fi

          if [ "$PREPARATION" = "blog-admin" ]; then
            node <<'NODE'
          const fs = require("node:fs")
          const expected = new Map([
            ["apps/deesse/package.json", ["1.0.0", "apps/deesse/CHANGELOG.md"]],
            ["apps/deesse-drizzle-adapter/package.json", ["2.0.0", "apps/deesse-drizzle-adapter/CHANGELOG.md"]],
            ["examples/next-shadcn-admin/apps/web/package.json", ["0.0.2", "examples/next-shadcn-admin/apps/web/CHANGELOG.md"]],
            ["examples/next-shadcn-monorepo/apps/web/package.json", ["0.0.2", "examples/next-shadcn-monorepo/apps/web/CHANGELOG.md"]],
          ])
          for (const [manifest, [version, changelog]] of expected) {
            const actual = JSON.parse(fs.readFileSync(manifest, "utf8")).version
            const history = fs.readFileSync(changelog, "utf8")
            if (actual !== version || !history.includes(`## ${version}`)) {
              console.error(`The Blog/Admin release-preparation artifact is missing or has an unexpected version: ${manifest}`)
              process.exitCode = 1
            }
          }
          NODE
          fi

          echo "trusted=true" >> "$GITHUB_OUTPUT"
          echo "Recognized the narrowly scoped $PREPARATION release-preparation PR."

      - name: Validate changed changesets
        if: steps.changed.outputs.touched == 'true' && steps.release-preparation.outputs.trusted != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git merge-base "origin/$BASE_REF" "$HEAD_SHA" >/dev/null 2>&1; then
            DIFF_ARGS=("origin/$BASE_REF...$HEAD_SHA")
          else
            echo "::notice::No merge base exists. Comparing the base and head snapshots."
            DIFF_ARGS=("origin/$BASE_REF" "$HEAD_SHA")
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "${DIFF_ARGS[@]}" -- .changeset | \
            grep -E '^\.changeset/[^/]+\.md$' | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$CHANGED" ]; then
            echo "::error::An existing public package surface was modified but no changeset file was added or updated."
            echo "::error::Add a changeset under .changeset/ describing the bump type."
            exit 1
          fi
          echo "Validating changed changeset files:"
          echo "$CHANGED"
          node scripts/validate-changesets.mjs $CHANGED
