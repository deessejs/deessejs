name: CLI publish verify

# Catches publish-path regressions at PR time, not at release time.
#
# The release workflow (release.yml) trusts the published package.json
# to be correct. Three recent releases (1.1.0, 1.1.1, 2.0.1) have shipped
# broken published artifacts. None of them were caught by CI because
# none of the CI jobs exercise the npm publish path.
#
# This workflow runs the four steps that would have caught all three
# incidents:
#
# 1. Pack the tarball locally (no registry).
# 2. Inspect the tarball contents (bad inclusions).
# 3. npm install --dry-run in a clean project (workspace:* deps).
# 4. Real npm install + npx <cli> --help (user-facing smoke test).
#
# Permissions: contents: read ONLY. No id-token: write, no NPM_TOKEN,
# no NODE_AUTH_TOKEN. The job does not publish; it only installs a
# tarball the build step produced locally. Trusted Publishing stays
# exclusively in release.yml.
#
# Note: release.yml now publishes BOTH @latest (Tier 3, on push to
# main) AND @canary (Tier 2, on workflow_dispatch with the `canary`
# input). The verify job packs and tests without publishing, so the
# multi-dist-tag change does not affect this workflow. The tarball
# shape is identical for both channels; what differs is the `--tag`
# flag on the publish step in release.yml, which is not exercised
# here.
#
# Implements the cli-publish-verify gate (Trusted Publisher setup).

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/cli/**"
      - "packages/contracts/**"
      - "packages/api/**"
      - ".github/workflows/cli-publish-verify.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-verify:
    name: Verify CLI publish artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the full workspace dep chain that the CLI transitively
      # consumes. We use `pnpm turbo build --filter=@deessejs/cli` so
      # transitive deps (`@workspace/api` -> `@workspace/auth` -> ...)
      # are built in topological order via Turbo's `dependsOn: ^build`.
      #
      # Turbo bypasses npm lifecycle hooks (the prebuild), so the
      # CLI's prebuild is not triggered here. That is fine: this
      # step produces the dist/ that tsup needs.
      #
      # The CLI's prebuild is left intact for local `pnpm dev` /
      # `pnpm test` where it gives correct results for the two
      # direct deps.
      - name: Build CLI and workspace deps
        run: pnpm turbo build --filter=@deessejs/cli

      # Step 1: pack the tarball that would be published.
      - name: Pack CLI tarball
        run: pnpm --filter @deessejs/cli exec npm pack

      # Step 2: inspect the contents. A successful pack is not enough;
      # the tarball must contain the compiled bundle and the expected
      # metadata files.
      #
      # We do NOT use `set -o pipefail` because `grep -q` closes its
      # stdin on first match, which sends SIGPIPE to `tar` and tar
      # exits non-zero. With pipefail, this would mask a successful
      # match as a failure. Instead we use a temp file and a simple
      # existence check.
      #
      # `package/dist/index.d.ts` is intentionally NOT in the required
      # list. The CLI is published as a runnable binary, not a library
      # (see `apps/cli/package.json` `bin` / `main` / `module` and the
      # `dts: false` rationale in `apps/cli/tsup.config.ts`). Generating
      # a stub `.d.ts` here would silently mask any future regression in
      # the typecheck path; removing the requirement keeps the verify
      # gate aligned with the actual contract (executable-only package).
      - name: Inspect tarball contents
        run: |
          set -eu
          TARBALL=$(ls apps/cli/deessejs-cli-*.tgz | head -1)
          echo "Inspecting: $TARBALL"
          FILES=$(tar -tzf "$TARBALL")
          echo "$FILES"
          for required in \
            "package/package.json" \
            "package/dist/index.js" \
            "package/README.md" \
          ; do
            if ! echo "$FILES" | grep -qxF "$required"; then
              echo "::error::Missing required file in tarball: $required"
              exit 1
            fi
          done
          # Defensive: the published manifest must not declare a `types`
          # field pointing at a file that does not exist in the tarball.
          # If a future change reintroduces `dts: true` in tsup.config.ts
          # the manifest will start claiming a `.d.ts` exists; this check
          # catches the drift between manifest and tarball before
          # consumers hit it on `npm install`.
          TYPES_PATH=$(node -e "const p=require('./apps/cli/package.json'); process.stdout.write(p.types||'')")
          if [ -n "$TYPES_PATH" ] && ! echo "$FILES" | grep -qxF "package/${TYPES_PATH#./}"; then
            echo "::error::Manifest declares types: ${TYPES_PATH} but the tarball does not contain package/${TYPES_PATH#./}"
            exit 1
          fi

      # Step 3: dry-run install in a clean project. This catches the
      # 2.0.1 failure mode (workspace:* / catalog: in dependencies
      # that npm cannot resolve from the registry).
      - name: Verify npm install (dry-run)
        run: |
          set -eu
          TARBALL=$(ls apps/cli/deessejs-cli-*.tgz | head -1)
          SCRATCH=$(mktemp -d)
          pushd "$SCRATCH" > /dev/null
          # Split the two commands so a failure in `npm init` vs
          # `npm install --dry-run` shows up as a distinct exit
          # code in the CI log. Previously both ran on the same
          # line and only the last exit code was reported, so a
          # failure in `npm init` would surface as a dry-run
          # failure and vice versa.
          npm init -y
          npm install --dry-run "$GITHUB_WORKSPACE/$TARBALL" || {
            rc=$?
            echo "::error::npm install --dry-run exited with code $rc"
            # npm writes a full debug log next to its cache on
            # every run; the path is in the error message. Dump
            # it so the next iteration of this job can diagnose
            # without re-running locally.
            DEBUG_LOG=$(ls -t /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | head -1 || true)
            if [ -n "$DEBUG_LOG" ]; then
              echo "::group::npm debug log ($DEBUG_LOG)"
              cat "$DEBUG_LOG"
              echo "::endgroup::"
            fi
            exit $rc
          }
          popd > /dev/null
          rm -rf "$SCRATCH"

      # Step 4: real install + npx smoke test. This is what the user
      # actually does. Fails if the install cannot complete or the
      # binary cannot run.
      - name: Real install + npx smoke test
        run: |
          set -eu
          TARBALL=$(ls apps/cli/deessejs-cli-*.tgz | head -1)
          SCRATCH=$(mktemp -d)
          pushd "$SCRATCH" > /dev/null
          npm init -y
          npm install "$GITHUB_WORKSPACE/$TARBALL" || {
            rc=$?
            echo "::error::npm install exited with code $rc"
            DEBUG_LOG=$(ls -t /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | head -1 || true)
            if [ -n "$DEBUG_LOG" ]; then
              echo "::group::npm debug log ($DEBUG_LOG)"
              cat "$DEBUG_LOG"
              echo "::endgroup::"
            fi
            exit $rc
          }
          npx @deessejs/cli --help
          popd > /dev/null
          rm -rf "$SCRATCH"
