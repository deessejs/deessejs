# apps/web browser end-to-end suite (PR-blocking).
#
# Runs after every Vercel preview deployment of the deessejs-web
# project. The trigger is `on: repository_dispatch` with
# `vercel.deployment.success`; the URL travels in
# `github.event.client_payload.url`.
#
# See https://vercel.com/kb/guide/how-can-i-run-end-to-end-tests-after-my-vercel-preview-deployment
# and https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#repository_dispatch
#
# Per ADR-020.
name: apps-web-e2e
on:
  # `repository_dispatch` only fires when the workflow file
  # exists on the default branch (per Vercel docs at
  # https://vercel.com/docs/git/vercel-for-github#repository-dispatch-events).
  # For PR-time validation, Vercel recommends adding
  # `workflow_dispatch` so the workflow can be triggered manually
  # from the GitHub Actions UI before the workflow file lands
  # on the default branch via merge.
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      base_url:
        description: |
          The preview URL to test against. Required for manual
          triggers (workflow_dispatch); ignored when triggered
          via repository_dispatch (which carries the URL in
          client_payload).
        required: false
        type: string
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run Playwright
        env:
          # The preview URL Vercel just deployed. The "Playwright tests"
          # bypass secret, mirrored from the Vercel dashboard
          # (see tests/e2e/RUNBOOK.md). For manual triggers, the
          # URL is passed via `workflow_dispatch.inputs.base_url`;
          # for repository_dispatch triggers, it travels in
          # `github.event.client_payload.url`.
          BASE_URL: ${{ github.event.client_payload.url || inputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: 1
        run: pnpm --filter web exec playwright test --config playwright.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: apps/web/tests/e2e/test-results/
          retention-days: 3