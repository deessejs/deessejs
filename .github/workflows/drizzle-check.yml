name: Drizzle drift check

# PR drift gate for Drizzle migrations.
#
# Two layers:
#   1. `pnpm db:check` validates the migration journal for
#      commutativity and ordering issues between migrations
#      already on disk.
#   2. `pnpm db:generate` re-run against the committed schema;
#      `git status --porcelain` catches both modifications and
#      untracked files (a brand-new migration file would slip
#      past `git diff --exit-code`).
#
# Plus a Squawk lint on the .sql files for destructive SQL.
# Implemented per ADR-015.

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  check:
    name: Drift + Squawk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Builds @workspace/env and @workspace/database so the
      # drizzle config can resolve @workspace/env/server at run
      # time. Mirrors the order used by ci.yml test-integration.
      - name: Build dependencies
        run: pnpm turbo build --filter=@workspace/database --force

      # Layer 1: validates the migration journal for commutativity
      # and ordering issues.
      - name: Run drizzle-kit check
        run: pnpm --filter @workspace/database db:check

      # Layer 2: re-runs generate against the committed schema.
      # Bounded timeout because a missed db:generate on a column
      # rename makes generate prompt on stdin, which would
      # otherwise block until the job-level 360-minute timeout.
      - name: Detect schema drift
        timeout-minutes: 2
        run: |
          pnpm --filter @workspace/database db:generate
          if [ -n "$(git status --porcelain packages/database/drizzle)" ]; then
            echo "Schema drift detected: uncommitted migrations or snapshots."
            git status --porcelain packages/database/drizzle
            exit 1
          fi

      # Layer 3: Squawk lints ONLY the .sql files this PR
      # introduces — `git diff --name-only` against the merge
      # base, scoped to packages/database/drizzle/*.sql. This is
      # necessary because the bootstrap migration triggers
      # dozens of valid Squawk warnings that are out of scope
      # for the gate; ADR-015 documents the rationale.
      #
      # We use the squawk-cli directly instead of the GitHub
      # Action because sbdchd/squawk-action@v1 is the only tagged
      # release and it is outdated: the @v1 tag only accepts
      # `pattern`, `version`, `access_token` inputs (no
      # fail-on-violations, no upload-to-github toggle). The
      # @main branch of the action has these inputs but is not
      # a tagged release and would be a moving target.
      - name: Lint migrations with Squawk
        run: |
          npm install -g squawk-cli
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          NEW=$(git diff --name-only "$BASE" "$HEAD" -- 'packages/database/drizzle/*.sql')
          if [ -z "$NEW" ]; then
            echo "No new SQL migrations in this PR. Skipping Squawk."
            exit 0
          fi
          echo "Linting PR-introduced migrations:"
          echo "$NEW"
          squawk $NEW
