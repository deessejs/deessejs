name: Release

# Senior release pattern: single workflow publishes +
# tag + GitHub Release in one job. Triggered by push to main or staging, or
# by manual workflow_dispatch.
#
# Two publish channels, both handled by this single workflow:
#   - @latest: push to main (Tier 3). Publishes the source-recorded CLI
#     version and stable Deesse framework/package versions when they are not
#     yet on npm, then creates package-specific GitHub Releases.
#   - @canary: push to staging (Tier 2), or on-demand workflow_dispatch
#     with `canary: true`. Synthetic version string (date+SHA);
#     currently publishes the CLI only. Framework, adapter, UI, and admin
#     canaries are deferred until their prerelease peer dependency contracts
#     are defined.
#
# Each npm package has its own Trusted Publisher configuration for this
# workflow. Stable and canary runs use the same workflow identity, so they do
# not need separate configurations per channel.
# See the inter-app-URL config rationale and the auto-canary trigger
# design for the chosen channel layout.
#
# The first @deessejs/drizzle-adapter publish uses npm staged publishing via
# a temporary stage-only NPM_DRIZZLE_BOOTSTRAP_TOKEN secret. The maintainer
# approves the staged version on npm, then records its GitHub Release here.
# Trusted Publishing is added before a later real adapter release.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      canary:
        description: 'Publish a @canary build from the current commit (instead of @latest).'
        type: boolean
        required: true
        default: false
      bootstrap_adapter:
        description: 'Stage the first @deessejs/drizzle-adapter version for npm approval.'
        type: boolean
        required: true
        default: false
      record_adapter_release:
        description: 'Create the tag and GitHub Release after approving the staged adapter version on npm.'
        type: boolean
        required: true
        default: false

concurrency:
  group: release-${{ github.ref }}
  # cancel-in-progress: false is load-bearing. We never cancel an in-flight
  # release: a partially-published canary on npm is worse than a serialized
  # wait. cli-preview.yml uses cancel-in-progress: true because pkg.pr.new
  # builds are stateless and ephemeral; this workflow mutates npm state and
  # must run to completion. Two rapid pushes to the same branch serialize;
  # pushes to different refs (staging vs main, or different PRs against
  # the same ref via workflow_dispatch) run in parallel because the group
  # key includes github.ref.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write   # OIDC for npm trusted publisher

jobs:
  release:
    runs-on: ubuntu-latest      # GitHub-hosted only — trusted publishers don't support self-hosted
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Configure git for release tags.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 0b. Determine release channel.
      #   workflow_dispatch with canary=true → canary/prerelease.
      #     (manual on-demand run by a maintainer.)
      #   push to staging → canary/prerelease.
      #     (auto-trigger; the merge carries the changeset check via
      #      changesets-check.yml on the feature PR.)
      #   push to main → latest/stable.
      # Downstream steps condition their behavior on these outputs.
      - name: Determine release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.canary }}" = "true" ]; then
            echo "dist_tag=canary"          >> "$GITHUB_OUTPUT"
            echo "release_type=prerelease"  >> "$GITHUB_OUTPUT"
            echo "version_source=synthetic" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "dist_tag=canary"          >> "$GITHUB_OUTPUT"
            echo "release_type=prerelease"  >> "$GITHUB_OUTPUT"
            echo "version_source=synthetic" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest"        >> "$GITHUB_OUTPUT"
            echo "release_type=stable"    >> "$GITHUB_OUTPUT"
            echo "version_source=manifest" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate manual release options
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "${{ inputs.canary }}" != "true" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Stable workflow_dispatch runs must use main. Select canary mode to publish from staging."
            exit 1
          fi
          if [ "${{ inputs.bootstrap_adapter }}" = "true" ] && [ "${{ inputs.canary }}" = "true" ]; then
            echo "::error::Adapter bootstrap is a stable main-only publish. Do not combine it with canary mode."
            exit 1
          fi
          if [ "${{ inputs.record_adapter_release }}" = "true" ] && [ "${{ inputs.canary }}" = "true" ]; then
            echo "::error::Recording the adapter's initial stable release cannot run in canary mode."
            exit 1
          fi
          if [ "${{ inputs.bootstrap_adapter }}" = "true" ] && [ "${{ inputs.record_adapter_release }}" = "true" ]; then
            echo "::error::Stage the adapter or record its approved release in separate workflow runs."
            exit 1
          fi
          if { [ "${{ inputs.bootstrap_adapter }}" = "true" ] || [ "${{ inputs.record_adapter_release }}" = "true" ]; } && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Adapter bootstrap must run from main."
            exit 1
          fi

      - name: Check whether stable CLI release is needed
        id: stable-release
        if: steps.channel.outputs.dist_tag == 'latest'
        run: |
          set -euo pipefail
          LOCAL_VERSION=$(node -e "console.log(require('./apps/cli/package.json').version)")
          LATEST_VERSION=$(npm view @deessejs/cli dist-tags.latest)
          EXACT_VERSION=$(npm view "@deessejs/cli@${LOCAL_VERSION}" version 2>/dev/null || true)
          ORDER=$(LOCAL_VERSION="$LOCAL_VERSION" LATEST_VERSION="$LATEST_VERSION" node -e '
            const parse = (v) => {
              const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(v)
              if (!match) throw new Error(`Expected stable X.Y.Z versions, got ${v}`)
              return match.slice(1).map(Number)
            }
            const local = parse(process.env.LOCAL_VERSION)
            const latest = parse(process.env.LATEST_VERSION)
            for (let i = 0; i < 3; i++) {
              if (local[i] !== latest[i]) {
                process.stdout.write(local[i] > latest[i] ? "ahead" : "behind")
                process.exit(0)
              }
            }
            process.stdout.write("equal")
          ')
          if [ "$ORDER" = behind ]; then
            echo "::error::CLI source version $LOCAL_VERSION is behind npm latest $LATEST_VERSION. Refusing a stable release."
            exit 1
          fi
          if [ "$ORDER" = equal ] || [ "$EXACT_VERSION" = "$LOCAL_VERSION" ]; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "No stable CLI release needed: source=$LOCAL_VERSION, npm latest=$LATEST_VERSION, exact=${EXACT_VERSION:-absent}."
            exit 0
          fi
          echo "release_needed=true" >> "$GITHUB_OUTPUT"
          echo "Stable CLI release needed: $LOCAL_VERSION is ahead of npm latest $LATEST_VERSION."

      # These are independent public package versions. The admin package is
      # already registered on npm and uses its configured Trusted Publisher.
      # The adapter is skipped until it exists on npm, unless a maintainer
      # explicitly stages its first version from main with a temporary token.
      - name: Check stable framework and package releases
        id: stable-packages
        if: steps.channel.outputs.dist_tag == 'latest'
        run: |
          set -euo pipefail

          check_registered_package() {
            local output_prefix="$1"
            local package_name="$2"
            local manifest_path="$3"
            local registered=true
            local local_version latest exact order

            local_version=$(node -e "console.log(require('./${manifest_path}').version)")
            if ! npm view "$package_name" name >/dev/null 2>"$RUNNER_TEMP/npm-view-error"; then
              if grep -q 'E404' "$RUNNER_TEMP/npm-view-error"; then
                registered=false
              else
                cat "$RUNNER_TEMP/npm-view-error" >&2
                echo "::error::Could not determine whether $package_name exists on npm."
                return 1
              fi
            fi

            echo "${output_prefix}_version=$local_version" >> "$GITHUB_OUTPUT"
            echo "${output_prefix}_registered=$registered" >> "$GITHUB_OUTPUT"

            if [ "$registered" = false ]; then
              PACKAGE_REGISTERED=false
              PACKAGE_RELEASE_NEEDED=true
              echo "${output_prefix}_release_needed=true" >> "$GITHUB_OUTPUT"
              return 0
            fi
            PACKAGE_REGISTERED=true

            latest=$(npm view "$package_name" dist-tags.latest 2>/dev/null || true)
            exact=$(npm view "${package_name}@${local_version}" version 2>/dev/null || true)
            if [ -n "$exact" ]; then
              PACKAGE_RELEASE_NEEDED=false
              echo "${output_prefix}_release_needed=false" >> "$GITHUB_OUTPUT"
              echo "$package_name@$local_version is already published."
              return 0
            fi

            if [ -z "$latest" ]; then
              PACKAGE_RELEASE_NEEDED=true
              echo "${output_prefix}_release_needed=true" >> "$GITHUB_OUTPUT"
              echo "$package_name has no latest tag; publishing source version $local_version."
              return 0
            fi

            order=$(LOCAL_VERSION="$local_version" LATEST_VERSION="$latest" node -e '
              const parse = (version) => {
                const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(version)
                if (!match) throw new Error(`Expected stable X.Y.Z versions, got ${version}`)
                return match.slice(1).map(Number)
              }
              const local = parse(process.env.LOCAL_VERSION)
              const latest = parse(process.env.LATEST_VERSION)
              for (let i = 0; i < 3; i++) {
                if (local[i] !== latest[i]) {
                  process.stdout.write(local[i] > latest[i] ? "ahead" : "behind")
                  process.exit(0)
                }
              }
              process.stdout.write("equal")
            ')

            if [ "$order" = behind ]; then
              echo "::error::$package_name source version $local_version is behind npm latest $latest. Refusing a stable release."
              return 1
            fi

            if [ "$order" = equal ]; then
              PACKAGE_RELEASE_NEEDED=false
              echo "${output_prefix}_release_needed=false" >> "$GITHUB_OUTPUT"
            else
              PACKAGE_RELEASE_NEEDED=true
              echo "${output_prefix}_release_needed=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_registered_package deesse deesse apps/deesse/package.json
          deesse_registered="$PACKAGE_REGISTERED"
          deesse_release_needed="$PACKAGE_RELEASE_NEEDED"
          check_registered_package adapter @deessejs/drizzle-adapter apps/deesse-drizzle-adapter/package.json
          adapter_registered="$PACKAGE_REGISTERED"
          adapter_release_needed="$PACKAGE_RELEASE_NEEDED"
          check_registered_package ui @deessejs/ui apps/ui/package.json
          ui_registered="$PACKAGE_REGISTERED"
          ui_release_needed="$PACKAGE_RELEASE_NEEDED"
          check_registered_package admin @deessejs/admin apps/admin/package.json
          admin_registered="$PACKAGE_REGISTERED"
          admin_release_needed="$PACKAGE_RELEASE_NEEDED"

          if [ "${{ inputs.record_adapter_release }}" = "true" ]; then
            if [ "$adapter_registered" != "true" ] || [ "$adapter_release_needed" = "true" ]; then
              echo "::error::The manifest version is not published yet. Approve the staged npm version before recording its GitHub release."
              exit 1
            fi
            echo "adapter_mode=record" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.bootstrap_adapter }}" = "true" ]; then
            if [ "$adapter_registered" = "true" ]; then
              echo "::error::The adapter already exists on npm. Use its Trusted Publisher for subsequent releases."
              exit 1
            fi
            echo "adapter_mode=stage" >> "$GITHUB_OUTPUT"
          elif [ "$adapter_registered" = "false" ]; then
            echo "adapter_mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::The adapter is not on npm yet. Stage its first version with bootstrap_adapter=true."
          elif [ "$adapter_release_needed" = "true" ]; then
            echo "adapter_mode=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "adapter_mode=skip" >> "$GITHUB_OUTPUT"
          fi

          if [ "$ui_registered" = "false" ]; then
            echo "ui_mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::@deessejs/ui is not registered on npm, so its Trusted Publisher cannot publish it."
          elif [ "$ui_release_needed" = "true" ]; then
            echo "ui_mode=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "ui_mode=skip" >> "$GITHUB_OUTPUT"
          fi

          if [ "$admin_registered" = "false" ]; then
            echo "::error::@deessejs/admin must be registered on npm before its Trusted Publisher can release it."
            exit 1
          elif [ "$admin_release_needed" = "true" ]; then
            echo "admin_mode=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "admin_mode=skip" >> "$GITHUB_OUTPUT"
          fi

          if [ "$deesse_registered" = "false" ]; then
            echo "::error::The deesse package must already exist on npm before its Trusted Publisher can release it."
            exit 1
          elif [ "$deesse_release_needed" = "true" ]; then
            echo "deesse_mode=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "deesse_mode=skip" >> "$GITHUB_OUTPUT"
          fi

      # Tier 2 — @canary version computation (synthetic, no changesets).
      # We deliberately do NOT run `pnpm changeset version` on the canary
      # path: it would consume changesets before the eventual @latest run
      # on main, dirty the working tree, and produce a `0.0.0-<date>` snapshot
      # version that does not match our `2.1.0-canary.<date>.<sha>` naming.
      # Instead we rewrite apps/cli/package.json#version in place via jq.
      #
      # Two guards surround the canary publish:
      #
      #   - Validate base version (pre-publish). The canary string is built
      #     by appending `-canary.<UTC-timestamp>.<short-sha>` to whatever
      #     apps/cli/package.json#version currently reads. If a previous
      #     run left a polluted value (e.g. `2.1.0-canary.x.y.z`), the next
      #     run would compute `2.1.0-canary.x.y.z-canary.a.b.c`. The
      #     validation step fails the job when the base is not a strict
      #     X.Y.Z. The validation reads from the committed version
      #     (`git show HEAD:apps/cli/package.json`), not from the working
      #     tree, so a previous dirty run cannot poison this check.
      #
      #   - Restore apps/cli version (post-publish). The canary rewrite
      #     leaves apps/cli/package.json dirty (set to the synthetic
      #     version). Without restoration, the next canary run sees the
      #     polluted value and computes a longer suffix chain. After the
      #     publish succeeds, this step rewrites the file back to the
      #     committed version. The published tarball is already on npm
      #     by the time the restore runs, so npm does not see the
      #     reset; only the next canary run sees the clean base.
      - name: Validate base version (canary)
        if: steps.channel.outputs.version_source == 'synthetic'
        run: |
          BASE=$(git show HEAD:apps/cli/package.json | jq -r '.version')
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::apps/cli/package.json#version is '$BASE', expected X.Y.Z."
            echo "::error::The committed version must be a clean semver release."
            echo "::error::If a previous canary run left the working tree dirty,"
            echo "::error::the post-publish restore step did not run; investigate."
            exit 1
          fi
          echo "Base version validated: $BASE"

      - name: Compute canary version
        if: steps.channel.outputs.version_source == 'synthetic'
        id: canary-version
        run: |
          BASE=$(node -e "console.log(require('./apps/cli/package.json').version)")
          TS=$(date -u +%Y%m%d%H%M%S)
          SHA="${GITHUB_SHA::7}"
          CANARY="${BASE}-canary.${TS}.${SHA}"
          echo "canary_version=${CANARY}" >> "$GITHUB_OUTPUT"
          echo "Computed canary version: ${CANARY}"

      - name: Rewrite apps/cli version for canary
        if: steps.channel.outputs.version_source == 'synthetic'
        run: |
          jq --arg v "${{ steps.canary-version.outputs.canary_version }}" \
            '.version = $v' \
            apps/cli/package.json > apps/cli/package.json.tmp
          mv apps/cli/package.json.tmp apps/cli/package.json
          # Lockfile drift is acceptable for canary (not a reproducible tier);
          # the in-place bump leaves the tree dirty, which `--no-git-checks`
          # on the publish step below handles.

      # Stable versions are persisted on staging by the Version Packages PR.
      # The main promotion carries that manifest and changelog state here.

      # 1b. Build all packages that produce publishable artifacts.
      # Without this, `dist/` (the actual bundle) is missing from the
      # published tarball — see incident on 2026-08-03 where @deessejs/cli@1.1.0
      # shipped without its compiled bundle and `npx` couldn't find the bin.
      # Use Turbo so transitive workspace deps (@workspace/api, @workspace/auth,
      # @workspace/database, @workspace/env, ...) get built in topological
      # order before @deessejs/cli. pnpm --filter does not follow transitive
      # workspace deps; plain `--filter` would surface as a build failure when
      # tsup tries to resolve a subpath export like @workspace/api/base-path
      # whose dist/ does not exist yet.
      - name: Build publishable packages
        run: pnpm turbo build --filter="@deessejs/cli" --force

      # 2. Publish to npm.
      #
      # Tier 3 (@latest): publish only the already-versioned CLI tarball.
      # Registry existence check makes promotion re-runs idempotent.
      #
      # Tier 2 (@canary): pack a tarball locally with `pnpm pack` (which
      # resolves pnpm-only protocol specifiers like `catalog:` and
      # `workspace:` into concrete version ranges), verify the packaged
      # manifest contains no pnpm-only specifiers, then publish the
      # SAME tarball with `npm publish <tarball> --tag canary --provenance
      # --no-git-checks`. The manifest scan is the same one
      # `cli-publish-verify.yml` runs at PR time; doing it here too means
      # a canary release cannot ship a manifest that would fail with
      # EUNSUPPORTEDPROTOCOL on a consumer's `npm install`.
      #
      # Why pack-then-publish, not `npm publish` directly: `npm publish`
      # packs internally using npm's resolver, which does not understand
      # `catalog:` or `workspace:` and ships them literally. The CLI's
      # `apps/cli/package.json` declares `cross-spawn: "catalog:"` and
      # several `workspace:*` devDeps, so a plain `npm publish` would
      # produce a tarball that consumers (running plain npm) cannot
      # install. `pnpm pack` resolves these before packing, matching
      # what the verify gate proves is installable.
      #
      # Three flags on the publish step are load-bearing:
      #   --tag canary     without it, npm moves the `latest` tag to the new
      #                    version and silently un-`latest`s the previous stable.
      #   --provenance     belt-and-suspenders alongside `publishConfig.provenance: true`.
      #   --no-git-checks  suppresses npm's "dirty working tree" error caused
      #                    by the synthetic version bump above.
      - name: Pack CLI stable tarball
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-release.outputs.release_needed == 'true'
        run: pnpm --dir apps/cli pack

      - name: Publish CLI to npm (latest)
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-release.outputs.release_needed == 'true'
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -eu
          TARBALL=$(ls apps/cli/deessejs-cli-*.tgz | head -1)
          npm publish "$TARBALL" --tag latest --provenance --no-git-checks

      - name: Pack CLI canary tarball
        if: steps.channel.outputs.dist_tag == 'canary'
        run: pnpm --dir apps/cli pack

      # Same manifest scan as cli-publish-verify.yml: the packaged
      # `package.json` must not contain pnpm-only specifiers
      # (`catalog:`, `workspace:`). Failing here, before any upload,
      # turns a "consumer can't install the canary" failure mode into
      # a red CI step the release owner can act on.
      - name: Verify canary tarball manifest
        if: steps.channel.outputs.dist_tag == 'canary'
        run: |
          set -eu
          TARBALL=$(ls apps/cli/deessejs-cli-*.tgz | head -1)
          echo "Inspecting canary tarball: $TARBALL"
          tar -xzOf "$TARBALL" package/package.json | node -e '
            const pkg = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const offenders = []
            const scan = (obj) => {
              if (!obj) return
              for (const [name, value] of Object.entries(obj)) {
                if (typeof value === "string" && (value === "catalog:" || value.startsWith("workspace:"))) {
                  offenders.push(`${name} = ${JSON.stringify(value)}`)
                }
                if (typeof value === "object") scan(value)
              }
            }
            scan(pkg.dependencies)
            scan(pkg.devDependencies)
            scan(pkg.peerDependencies)
            if (offenders.length) {
              console.error("::error::Canary manifest contains pnpm-only specifiers:")
              for (const o of offenders) console.error("  - " + o)
              process.exit(1)
            }
          '

      - name: Publish to npm (canary)
        if: steps.channel.outputs.dist_tag == 'canary'
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          TARBALL=$(ls apps/cli/deessejs-cli-*.tgz | head -1)
          npm publish "$TARBALL" \
            --tag canary \
            --provenance \
            --no-git-checks
          # Defensive: guarantee `latest` did not move.
          # Read the previous latest from the registry (not from the local
          # package.json, which now holds the synthetic canary version).
          PREVIOUS=$(npm view @deessejs/cli@latest version 2>/dev/null || echo "")
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "${{ steps.canary-version.outputs.canary_version }}" ]; then
            npm dist-tag add @deessejs/cli@${PREVIOUS} latest
            echo "Re-pinned @latest to ${PREVIOUS} as belt-and-suspenders."
          else
            echo "@latest unchanged; no defensive re-pin needed."
          fi

      # Post-publish restore. The canary rewrite (step above) leaves
      # apps/cli/package.json dirty (set to the synthetic canary version).
      # Without this step, the next canary run would compute
      # `<synthetic>-canary.<new-timestamp>.<new-sha>`, producing a
      # suffix chain that grows without bound. After the publish
      # succeeds, this step rewrites the file back to the committed
      # version (X.Y.Z). The published tarball is already on npm; only
      # the next canary run sees the clean base.
      - name: Restore apps/cli version after canary publish
        if: steps.channel.outputs.dist_tag == 'canary'
        working-directory: apps/cli
        run: |
          BASE=$(git show HEAD:apps/cli/package.json | jq -r '.version')
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          if [ "$CURRENT" = "$BASE" ]; then
            echo "Version already at base ($BASE); no restore needed."
            exit 0
          fi
          echo "Restoring apps/cli/package.json#version from $CURRENT to $BASE"
          jq --arg v "$BASE" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      # 3. Read the new CLI version.
      # On the @canary path, the post-publish restore step has reset
      # apps/cli/package.json#version to the base value, so reading the
      # file would yield the base instead of the synthetic canary
      # version. We use steps.canary-version.outputs.canary_version when
      # available, falling back to the file read on the @latest path.
      - name: Read new version
        id: version
        run: |
          if [ -n "${{ steps.canary-version.outputs.canary_version }}" ]; then
            VERSION="${{ steps.canary-version.outputs.canary_version }}"
          else
            VERSION=$(node -e "console.log(require('./apps/cli/package.json').version)")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 4. Tag + push tag (force-update for idempotency).
      # Tier 2 canary tags look like `release/v2.1.0-canary.20260821143022.a832a55`
      # — same convention as Tier 3, with the synthetic suffix. Tags are visible
      # in the GitHub Releases feed marked as prereleases via the
      # `prerelease` flag on the action below.
      - name: Tag release
        if: steps.channel.outputs.dist_tag == 'canary' || steps.stable-release.outputs.release_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "release/v${{ steps.version.outputs.version }}"
          git push --force origin "release/v${{ steps.version.outputs.version }}"

      # 5. GitHub Release.
      # `prerelease` is set from `steps.channel.outputs.release_type`, so
      # @canary releases are marked as prereleases in the Releases feed
      # (visually distinct from @latest stable releases). The tag and title
      # follow the same convention for both channels.
      - name: GitHub Release
        if: steps.channel.outputs.dist_tag == 'canary' || steps.stable-release.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release/v${{ steps.version.outputs.version }}
          name: "Release v${{ steps.version.outputs.version }}"
          prerelease: ${{ steps.channel.outputs.release_type == 'prerelease' }}
          generate_notes: true
          fail_on_unmatched_files: true

      # Stable releases for the public framework and packages.
      # These packages use independent source versions and package-specific
      # GitHub tags. They intentionally do not join the CLI's staging canary
      # channel until their prerelease peer contracts are designed.
      - name: Build Deesse framework and adapter
        if: >-
          steps.channel.outputs.dist_tag == 'latest' &&
          (steps.stable-packages.outputs.deesse_release_needed == 'true' ||
           steps.stable-packages.outputs.adapter_mode == 'trusted' ||
           steps.stable-packages.outputs.adapter_mode == 'stage')
        run: pnpm turbo build --filter=deesse --filter=@deessejs/drizzle-adapter --force

      - name: Build UI package
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.ui_mode == 'trusted'
        run: pnpm turbo build --filter=@deessejs/ui --force

      - name: Build admin package and workspace dependencies
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.admin_mode == 'trusted'
        run: pnpm turbo build --filter=@deessejs/admin... --force

      - name: Pack and verify UI package
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.ui_mode == 'trusted'
        run: |
          set -euo pipefail
          pnpm --dir apps/ui pack
          TARBALL=$(find apps/ui -maxdepth 1 -type f -name '*.tgz' -print -quit)
          node scripts/verify-npm-tarball.mjs \
            "$TARBALL" \
            @deessejs/ui \
            "${{ steps.stable-packages.outputs.ui_version }}" \
            package/dist/index.js \
            package/dist/cn.js \
            package/tailwind.css \
            package/README.md \
            package/LICENSE

      - name: Publish UI package to npm with Trusted Publishing
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.ui_mode == 'trusted'
        run: |
          set -euo pipefail
          TARBALL=$(find apps/ui -maxdepth 1 -type f -name '*.tgz' -print -quit)
          npm publish "$TARBALL" --tag latest --provenance --no-git-checks

      - name: Tag UI package release
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.ui_mode == 'trusted'
        env:
          RELEASE_VERSION: ${{ steps.stable-packages.outputs.ui_version }}
        run: |
          set -euo pipefail
          git tag -f "ui/v${RELEASE_VERSION}"
          git push --force origin "ui/v${RELEASE_VERSION}"

      - name: Create UI package GitHub Release
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.ui_mode == 'trusted'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui/v${{ steps.stable-packages.outputs.ui_version }}
          name: "@deessejs/ui v${{ steps.stable-packages.outputs.ui_version }}"
          prerelease: false
          generate_notes: true
          fail_on_unmatched_files: true

      - name: Pack and verify Deesse framework
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.deesse_mode == 'trusted'
        run: |
          set -euo pipefail
          pnpm --dir apps/deesse pack
          TARBALL=$(find apps/deesse -maxdepth 1 -type f -name '*.tgz' -print -quit)
          node scripts/verify-npm-tarball.mjs \
            "$TARBALL" \
            deesse \
            "${{ steps.stable-packages.outputs.deesse_version }}" \
            package/dist/index.js \
            package/dist/react.js \
            package/dist/next.js \
            package/README.md \
            package/LICENSE

      - name: Publish Deesse framework to npm
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.deesse_mode == 'trusted'
        run: |
          set -euo pipefail
          TARBALL=$(find apps/deesse -maxdepth 1 -type f -name '*.tgz' -print -quit)
          npm publish "$TARBALL" --tag latest --provenance --no-git-checks

      - name: Tag Deesse framework release
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.deesse_mode == 'trusted'
        env:
          RELEASE_VERSION: ${{ steps.stable-packages.outputs.deesse_version }}
        run: |
          set -euo pipefail
          git tag -f "deesse/v${RELEASE_VERSION}"
          git push --force origin "deesse/v${RELEASE_VERSION}"

      - name: Create Deesse framework GitHub Release
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.deesse_mode == 'trusted'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deesse/v${{ steps.stable-packages.outputs.deesse_version }}
          name: "deesse v${{ steps.stable-packages.outputs.deesse_version }}"
          prerelease: false
          generate_notes: true
          fail_on_unmatched_files: true

      - name: Confirm admin Deesse peer range is published
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.admin_mode == 'trusted'
        run: |
          set -euo pipefail
          DEESSE_PEER_RANGE=$(node -e "console.log(require('./apps/admin/package.json').peerDependencies.deesse)")
          npm view "deesse@${DEESSE_PEER_RANGE}" version

      - name: Pack and verify admin package
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.admin_mode == 'trusted'
        run: |
          set -euo pipefail
          pnpm --dir apps/admin pack
          TARBALL=$(find apps/admin -maxdepth 1 -type f -name '*.tgz' -print -quit)
          node scripts/verify-npm-tarball.mjs \
            "$TARBALL" \
            @deessejs/admin \
            "${{ steps.stable-packages.outputs.admin_version }}" \
            package/dist/index.js \
            package/dist/next.js \
            package/src/admin.css \
            package/README.md \
            package/LICENSE

      - name: Publish admin package to npm with Trusted Publishing
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.admin_mode == 'trusted'
        run: |
          set -euo pipefail
          TARBALL=$(find apps/admin -maxdepth 1 -type f -name '*.tgz' -print -quit)
          npm publish "$TARBALL" --tag latest --provenance --no-git-checks

      - name: Tag admin package release
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.admin_mode == 'trusted'
        env:
          RELEASE_VERSION: ${{ steps.stable-packages.outputs.admin_version }}
        run: |
          set -euo pipefail
          git tag -f "admin/v${RELEASE_VERSION}"
          git push --force origin "admin/v${RELEASE_VERSION}"

      - name: Create admin package GitHub Release
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.admin_mode == 'trusted'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin/v${{ steps.stable-packages.outputs.admin_version }}
          name: "@deessejs/admin v${{ steps.stable-packages.outputs.admin_version }}"
          prerelease: false
          generate_notes: true
          fail_on_unmatched_files: true

      - name: Pack and verify Drizzle adapter
        if: steps.channel.outputs.dist_tag == 'latest' && (steps.stable-packages.outputs.adapter_mode == 'trusted' || steps.stable-packages.outputs.adapter_mode == 'stage')
        run: |
          set -euo pipefail
          pnpm --dir apps/deesse-drizzle-adapter pack
          TARBALL=$(find apps/deesse-drizzle-adapter -maxdepth 1 -type f -name '*.tgz' -print -quit)
          node scripts/verify-npm-tarball.mjs \
            "$TARBALL" \
            @deessejs/drizzle-adapter \
            "${{ steps.stable-packages.outputs.adapter_version }}" \
            package/dist/index.js \
            package/dist/cli.js \
            package/README.md \
            package/LICENSE

      - name: Confirm Deesse peer version is published
        if: steps.channel.outputs.dist_tag == 'latest' && (steps.stable-packages.outputs.adapter_mode == 'trusted' || steps.stable-packages.outputs.adapter_mode == 'stage')
        env:
          DEESSE_VERSION: ${{ steps.stable-packages.outputs.deesse_version }}
        run: npm view "deesse@${DEESSE_VERSION}" version

      - name: Publish Drizzle adapter to npm with Trusted Publishing
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.adapter_mode == 'trusted'
        run: |
          set -euo pipefail
          TARBALL=$(find apps/deesse-drizzle-adapter -maxdepth 1 -type f -name '*.tgz' -print -quit)
          npm publish "$TARBALL" --tag latest --provenance --no-git-checks

      - name: Install npm CLI with staged publishing support
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.adapter_mode == 'stage'
        run: npm install --global 'npm@^11.15.0'

      # npm cannot attach Trusted Publishing to a package that is not on the
      # registry. Stage the first real version with a temporary stage-only
      # token, inspect and approve it on npm, then run the record option below.
      # A new package gets a public 0.0.0-stage placeholder while its staged
      # version and contents remain unavailable until approval.
      - name: Stage first Drizzle adapter version for npm approval
        if: steps.channel.outputs.dist_tag == 'latest' && steps.stable-packages.outputs.adapter_mode == 'stage'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DRIZZLE_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set the temporary stage-only NPM_DRIZZLE_BOOTSTRAP_TOKEN Actions secret before staging the adapter."
            exit 1
          fi
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          TARBALL=$(find apps/deesse-drizzle-adapter -maxdepth 1 -type f -name '*.tgz' -print -quit)
          NPM_CONFIG_USERCONFIG="$NPM_CONFIG_USERCONFIG" npm stage publish "$TARBALL"
          echo "Review the staged package on npm, approve it with 2FA, then run release.yml from main with record_adapter_release=true."

      - name: Tag Drizzle adapter release
        if: steps.channel.outputs.dist_tag == 'latest' && (steps.stable-packages.outputs.adapter_mode == 'trusted' || steps.stable-packages.outputs.adapter_mode == 'record')
        env:
          RELEASE_VERSION: ${{ steps.stable-packages.outputs.adapter_version }}
        run: |
          set -euo pipefail
          git tag -f "drizzle-adapter/v${RELEASE_VERSION}"
          git push --force origin "drizzle-adapter/v${RELEASE_VERSION}"

      - name: Create Drizzle adapter GitHub Release
        if: steps.channel.outputs.dist_tag == 'latest' && (steps.stable-packages.outputs.adapter_mode == 'trusted' || steps.stable-packages.outputs.adapter_mode == 'record')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: drizzle-adapter/v${{ steps.stable-packages.outputs.adapter_version }}
          name: "@deessejs/drizzle-adapter v${{ steps.stable-packages.outputs.adapter_version }}"
          prerelease: false
          generate_notes: true
          fail_on_unmatched_files: true

