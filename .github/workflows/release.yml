name: Release

# One publish path for every public package, two dist-tags.
#
# Both channels do the same thing: build, pack, verify, publish. Only the
# version source and the dist-tag differ.
#
#   @canary  push to staging (or workflow_dispatch with canary: true).
#            Synthetic version `<committed base>-canary.<UTC ts>.<short sha>`,
#            written into the manifest before packing and restored afterwards.
#            Publishes on every run and never moves `latest`.
#
#   @latest  push to main. Version is whatever the checked-out manifest says,
#            published only when it is strictly ahead of what npm serves.
#            One GitHub Release per published version.
#
# Three deliberate departures from the workflow this replaces:
#
#   1. The stable channel is not gated on a commit message. It was gated on
#      `contains(head_commit.message, ".changeset")`, which a staging-to-main
#      merge commit does not satisfy, so stable releases silently never ran.
#      It is now gated on a comparison against the npm registry.
#   2. The version is no longer bumped on the runner and thrown away. The bump
#      is persisted by the Version Packages pull request (version-packages.yml)
#      before it gets here, so a run publishes what the repository says rather
#      than recomputing it.
#   3. Canary does not re-pin `latest` after publishing. `--tag canary` does not
#      move `latest`, so there was nothing to repair, and with concurrency
#      grouped per ref a slow canary finishing after a stable publish could
#      re-pin `latest` to an older version. Removing the re-pin removes that
#      failure mode instead of mitigating it.
#
# Trusted Publishing: id-token: write is scoped here and nowhere else. The
# publish-verify workflow holds contents: read only and never publishes.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      canary:
        description: 'Publish a @canary build from the current commit (instead of @latest).'
        type: boolean
        required: true
        default: false

concurrency:
  group: release-${{ github.ref }}
  # cancel-in-progress: false is load-bearing. We never cancel an in-flight
  # release: a partially published package on npm is worse than a serialized
  # wait. Two rapid pushes to the same branch serialize. Pushes to different
  # refs (staging vs main) run in parallel because the group key includes
  # github.ref, which is now safe precisely because the canary path never
  # touches the `latest` dist-tag.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write   # OIDC for npm trusted publishing

jobs:
  # GitHub evaluates strategy.matrix at job start, so the package list cannot be
  # produced by a step inside the job that iterates it. This job exposes it as
  # an output; the publish job consumes it with fromJSON. Keeping discovery in
  # its own job is also what makes a third public package a zero-config change.
  discover:
    name: Discover publishable packages
    runs-on: ubuntu-latest      # GitHub-hosted only; trusted publishers do not support self-hosted
    outputs:
      packages: ${{ steps.scan.outputs.packages }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Scan for public packages
        id: scan
        run: |
          node -e '
            const fs = require("node:fs")
            const path = require("node:path")
            const include = []
            for (const dir of ["apps", "packages"]) {
              if (!fs.existsSync(dir)) continue
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (!entry.isDirectory()) continue
                const pkgPath = path.join(dir, entry.name, "package.json")
                if (!fs.existsSync(pkgPath)) continue
                try {
                  const p = JSON.parse(fs.readFileSync(pkgPath, "utf8"))
                  if (!p || !p.name || p.private === true) continue
                  include.push({ dir: dir + "/" + entry.name, name: p.name })
                } catch {}
              }
            }
            include.sort((a, b) => a.name.localeCompare(b.name))
            console.log("Publishable packages: " + (include.map((e) => e.name).join(", ") || "(none)"))
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              "packages=" + JSON.stringify({ include }) + "\n" +
              "count=" + include.length + "\n"
            )
          '

  publish:
    name: Publish ${{ matrix.name }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      # A package that cannot be packed must not cancel the other package's
      # publish. The run summary then shows which one failed, and the registry
      # gate on the next run picks up the one still missing.
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Install before the manifest is rewritten for canary. pnpm's lockfile
      # does not record workspace package versions, so either order works, but
      # installing against the committed manifest is the state we know is good.
      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine release channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANARY_INPUT: ${{ inputs.canary }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CANARY_INPUT" = "true" ]; then
            echo "dist_tag=canary" >> "$GITHUB_OUTPUT"
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "refs/heads/staging" ]; then
            echo "dist_tag=canary" >> "$GITHUB_OUTPUT"
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "refs/heads/main" ]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "release_type=stable" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Refusing to publish from unsupported ref '$REF_NAME'. Stable releases require main; use canary=true for an explicit preview."
            exit 1
          fi
          echo "Channel: ${{ steps.channel.outputs.dist_tag }} for ${{ matrix.name }}"

      # Stable only. Compared against the registry rather than derived from a
      # commit message, which makes the job idempotent and self-healing: a
      # re-run, a partial failure, or a promotion that carried no bump all
      # resolve with nobody deciding anything.
      - name: Compare against the npm registry
        id: decision
        if: steps.channel.outputs.dist_tag == 'latest'
        env:
          PKG_NAME: ${{ matrix.name }}
          PKG_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          LOCAL=$(node -e "process.stdout.write(String(require('./$PKG_DIR/package.json').version))")
          LATEST=$(npm view "$PKG_NAME" dist-tags.latest 2>/dev/null || true)
          VERSIONS=$(npm view "$PKG_NAME" versions --json 2>/dev/null || echo "null")

          PUBLISH=false
          REASON=""
          if [ -z "$LATEST" ]; then
            PUBLISH=true
            REASON="no version published yet"
          else
            OUTCOME=$(LOCAL="$LOCAL" LATEST="$LATEST" VERSIONS="$VERSIONS" node -e '
              const strip = (v) => String(v).split("-")[0]
              const cmp = (a, b) => {
                const pa = strip(a).split(".").map(Number)
                const pb = strip(b).split(".").map(Number)
                for (let i = 0; i < 3; i++) {
                  if (pa[i] !== pb[i]) return pa[i] < pb[i] ? -1 : 1
                }
                return 0
              }
              const local = process.env.LOCAL
              const latest = process.env.LATEST
              let list = []
              try {
                const parsed = JSON.parse(process.env.VERSIONS || "null")
                list = Array.isArray(parsed) ? parsed : parsed ? [String(parsed)] : []
              } catch {}
              if (list.includes(local)) {
                console.log("skip: " + local + " is already published")
              } else if (cmp(local, latest) < 0) {
                // Anomalous: the repository is behind the registry. Publishing
                // would move `latest` backwards, so stop and make it visible.
                console.log("skip: would move latest backwards from " + latest + " to " + local)
              } else {
                console.log("publish: " + local + " is ahead of " + latest)
              }
            ')
            case "$OUTCOME" in
              skip:*) PUBLISH=false; REASON="${OUTCOME#skip: }" ;;
              publish:*) PUBLISH=true; REASON="${OUTCOME#publish: }" ;;
            esac
          fi

          echo "local_version=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "registry_latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "$PKG_NAME: publish=$PUBLISH ($REASON)"

      - name: Report a version that would move latest backwards
        if: steps.channel.outputs.dist_tag == 'latest' && startsWith(steps.decision.outputs.reason, 'would move latest backwards')
        run: |
          echo "::error::${{ matrix.name }} is at ${{ steps.decision.outputs.local_version }} but npm serves ${{ steps.decision.outputs.registry_latest }}."
          echo "::error::Publishing would move the latest dist-tag backwards. Align the manifest first."

      - name: Compute the canary version
        id: canary
        if: steps.channel.outputs.dist_tag == 'canary'
        env:
          PKG_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          # Read the base from the committed manifest, not the working tree,
          # so a dirty runner cannot poison it. Without this validation a run
          # that left the tree dirty would compute
          # `0.5.7-canary.a.b-canary.c.d` on the next execution.
          BASE=$(git show "HEAD:$PKG_DIR/package.json" \
            | node -e "let d='';process.stdin.on('data',(c)=>{d+=c}).on('end',()=>process.stdout.write(String(JSON.parse(d).version)))")
          if ! printf '%s' "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$PKG_DIR/package.json#version is '$BASE', expected strict X.Y.Z."
            echo "::error::A previous canary run may not have restored the manifest."
            exit 1
          fi
          TS=$(date -u +%Y%m%d%H%M%S)
          SHA="${GITHUB_SHA::7}"
          echo "version=${BASE}-canary.${TS}.${SHA}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Canary version for $PKG_DIR: ${BASE}-canary.${TS}.${SHA}"

      - name: Rewrite the manifest version for canary
        if: steps.channel.outputs.dist_tag == 'canary'
        env:
          PKG_DIR: ${{ matrix.dir }}
          VERSION: ${{ steps.canary.outputs.version }}
        run: |
          set -euo pipefail
          PKG_JSON="$PKG_DIR/package.json"
          jq --arg v "$VERSION" '.version = $v' "$PKG_JSON" > "$PKG_JSON.tmp"
          mv "$PKG_JSON.tmp" "$PKG_JSON"

      - name: Build ${{ matrix.name }}
        if: steps.decision.outputs.publish != 'false' || steps.channel.outputs.dist_tag == 'canary'
        run: pnpm turbo build --filter="${{ matrix.name }}" --force

      - name: Pack and verify ${{ matrix.name }}
        id: pack
        if: steps.decision.outputs.publish != 'false' || steps.channel.outputs.dist_tag == 'canary'
        run: |
          set -euo pipefail
          TARBALL=$(bash .github/scripts/verify-packed-package.sh "${{ matrix.dir }}" | tail -1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL"

      - name: Publish ${{ matrix.name }}
        id: publish
        if: steps.decision.outputs.publish != 'false' || steps.channel.outputs.dist_tag == 'canary'
        env:
          NPM_CONFIG_PROVENANCE: true
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # --access public is explicit even though both manifests declare it
          # through publishConfig, because the repository-level changesets
          # access default is not the same thing as a per-package setting.
          # --tag is load-bearing: without it npm moves `latest` to the new
          # version and silently un-lasts the previous stable.
          npm publish "$TARBALL" \
            --tag "$DIST_TAG" \
            --access public \
            --provenance \
            --no-git-checks
          echo "version=$(node -e "process.stdout.write(String(require('./${{ matrix.dir }}/package.json').version)))")" >> "$GITHUB_OUTPUT"

      # Runs whether or not anything was published, so a skipped release leaves
      # a trace. A release that fails silently is the failure mode this step
      # exists to remove.
      - name: Summary
        if: always()
        env:
          PKG_NAME: ${{ matrix.name }}
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
          DECISION_PUBLISH: ${{ steps.decision.outputs.publish }}
          DECISION_REASON: ${{ steps.decision.outputs.reason }}
          LOCAL_VERSION: ${{ steps.decision.outputs.local_version }}
          CANARY_VERSION: ${{ steps.canary.outputs.version }}
          REGISTRY_LATEST: ${{ steps.decision.outputs.registry_latest }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          PUBLISHED_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### $PKG_NAME"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Channel | \`$DIST_TAG\` |"
            echo "| Version considered | \`${CANARY_VERSION:-$LOCAL_VERSION}\` |"
            echo "| Version on npm (\`latest\`) | \`${REGISTRY_LATEST:-none}\` |"
            echo "| Outcome | $DECISION_REASON |"
            echo "| Tarball | \`${TARBALL:-not packed}\` |"
            echo "| Published version | \`${PUBLISHED_VERSION:-none}\` |"
            echo ""
            echo "This table is the evidence issue #230 asks to be recorded: published version,"
            echo "source commit, registry retrieval and validation, attached to the merge that produced them."
          } >> "$GITHUB_STEP_SUMMARY"

      # The published tarball is already on npm by the time this runs, so npm
      # never sees the reset. Only the next run can observe the restored value.
      - name: Restore the manifest version after a canary publish
        if: always() && steps.channel.outputs.dist_tag == 'canary'
        env:
          PKG_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          BASE=$(git show "HEAD:$PKG_DIR/package.json" \
            | node -e "let d='';process.stdin.on('data',(c)=>{d+=c}).on('end',()=>process.stdout.write(String(JSON.parse(d).version)))")
          PKG_JSON="$PKG_DIR/package.json"
          CURRENT=$(node -e "process.stdout.write(String(require('./$PKG_JSON').version))")
          if [ "$CURRENT" = "$BASE" ]; then
            echo "Version already at base ($BASE); no restore needed."
            exit 0
          fi
          echo "Restoring $PKG_JSON#version from $CURRENT to $BASE"
          jq --arg v "$BASE" '.version = $v' "$PKG_JSON" > "$PKG_JSON.tmp"
          mv "$PKG_JSON.tmp" "$PKG_JSON"

      # Stable only. Canary publishes to npm and stops: several merges to
      # staging a week would bury the stable entries in the Releases feed.
      #
      # Namespaced per package so two packages can never overwrite each
      # other's tag. `git tag -f` is kept for idempotency.
      - name: Tag the release
        id: tag
        if: steps.channel.outputs.dist_tag == 'latest' && steps.publish.outputs.version != ''
        env:
          PKG_NAME: ${{ matrix.name }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          SAFE_NAME=$(printf '%s' "$PKG_NAME" | sed -e 's|/|-|g' -e 's|^@||')
          TAG="release/${SAFE_NAME}/v${VERSION}"
          echo "Tagging $TAG"
          git tag -f "$TAG"
          git push --force origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        if: steps.publish.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ matrix.name }} ${{ steps.publish.outputs.version }}
          prerelease: false
          generate_notes: true
          fail_on_unmatched_files: true