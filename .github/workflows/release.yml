name: Release

# Senior release pattern: single workflow does version bump + npm publish +
# tag + GitHub Release in one job. Triggered by push to main or staging, or
# by manual workflow_dispatch.
#
# Two publish channels, both handled by this single workflow:
#   - @latest: push to main (Tier 3). Changesets-driven version bump;
#     pnpm changeset publish; stable GitHub Release. Auto-publishes
#     when the commit message contains '.changeset'.
#   - @canary: push to staging (Tier 2), or on-demand workflow_dispatch
#     with `canary: true`. Synthetic version string (date+SHA);
#     npm publish --tag canary; GitHub Release marked as prerelease.
#
# Both channels share the same npm trusted publisher entry (release.yml);
# npm Trusted Publishing allows only one trusted publisher per package,
# keyed on this workflow file's path. Adding staging to the push triggers
# does not require a second trusted publisher entry.
# See ADR-021 §"Decision" and ADR-025 for the auto-canary trigger.
#
# First-ever publish of @deessejs/cli is manual from a maintainer's machine
# (npm has no "pending publisher" feature). See
# docs/engineering/reports/versioning/12-npm-setup-walkthrough.md.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      canary:
        description: 'Publish a @canary build from the current commit (instead of @latest).'
        type: boolean
        required: true
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write   # OIDC for npm trusted publisher

jobs:
  release:
    runs-on: ubuntu-latest      # GitHub-hosted only — trusted publishers don't support self-hosted
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/staging' ||
      contains(github.event.head_commit.message, '.changeset')
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 0. Configure git (changesets will commit on our behalf via `commit: true`)
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 0b. Determine release channel.
      #   workflow_dispatch with canary=true → canary/prerelease.
      #     (manual on-demand run by a maintainer.)
      #   push to staging → canary/prerelease.
      #     (auto-trigger; the merge carries the changeset check via
      #      changesets-check.yml on the feature PR, see ADR-026.)
      #   push to main (commit message contains .changeset) → latest/stable.
      # Downstream steps condition their behavior on these outputs.
      - name: Determine release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.canary }}" = "true" ]; then
            echo "dist_tag=canary"          >> "$GITHUB_OUTPUT"
            echo "release_type=prerelease"  >> "$GITHUB_OUTPUT"
            echo "version_source=synthetic" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "dist_tag=canary"          >> "$GITHUB_OUTPUT"
            echo "release_type=prerelease"  >> "$GITHUB_OUTPUT"
            echo "version_source=synthetic" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest"        >> "$GITHUB_OUTPUT"
            echo "release_type=stable"    >> "$GITHUB_OUTPUT"
            echo "version_source=changeset" >> "$GITHUB_OUTPUT"
          fi

      # Tier 2 — @canary version computation (synthetic, no changesets).
      # We deliberately do NOT run `pnpm changeset version` on the canary
      # path: it would consume changesets before the eventual @latest run
      # on main, dirty the working tree, and produce a `0.0.0-<date>` snapshot
      # version that does not match our `2.1.0-canary.<date>.<sha>` naming.
      # Instead we rewrite apps/cli/package.json#version in place via jq.
      #
      # Two guards surround the canary publish:
      #
      #   - Validate base version (pre-publish). The canary string is built
      #     by appending `-canary.<UTC-timestamp>.<short-sha>` to whatever
      #     apps/cli/package.json#version currently reads. If a previous
      #     run left a polluted value (e.g. `2.1.0-canary.x.y.z`), the next
      #     run would compute `2.1.0-canary.x.y.z-canary.a.b.c`. The
      #     validation step fails the job when the base is not a strict
      #     X.Y.Z. The validation reads from the committed version
      #     (`git show HEAD:apps/cli/package.json`), not from the working
      #     tree, so a previous dirty run cannot poison this check.
      #
      #   - Restore apps/cli version (post-publish). The canary rewrite
      #     leaves apps/cli/package.json dirty (set to the synthetic
      #     version). Without restoration, the next canary run sees the
      #     polluted value and computes a longer suffix chain. After the
      #     publish succeeds, this step rewrites the file back to the
      #     committed version. The published tarball is already on npm
      #     by the time the restore runs, so npm does not see the
      #     reset; only the next canary run sees the clean base.
      - name: Validate base version (canary)
        if: steps.channel.outputs.version_source == 'synthetic'
        run: |
          BASE=$(git show HEAD:apps/cli/package.json | jq -r '.version')
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::apps/cli/package.json#version is '$BASE', expected X.Y.Z."
            echo "::error::The committed version must be a clean semver release."
            echo "::error::If a previous canary run left the working tree dirty,"
            echo "::error::the post-publish restore step did not run; investigate."
            exit 1
          fi
          echo "Base version validated: $BASE"

      - name: Compute canary version
        if: steps.channel.outputs.version_source == 'synthetic'
        id: canary-version
        run: |
          BASE=$(node -e "console.log(require('./apps/cli/package.json').version)")
          TS=$(date -u +%Y%m%d%H%M%S)
          SHA="${GITHUB_SHA::7}"
          CANARY="${BASE}-canary.${TS}.${SHA}"
          echo "canary_version=${CANARY}" >> "$GITHUB_OUTPUT"
          echo "Computed canary version: ${CANARY}"

      - name: Rewrite apps/cli version for canary
        if: steps.channel.outputs.version_source == 'synthetic'
        run: |
          jq --arg v "${{ steps.canary-version.outputs.canary_version }}" \
            '.version = $v' \
            apps/cli/package.json > apps/cli/package.json.tmp
          mv apps/cli/package.json.tmp apps/cli/package.json
          # Lockfile drift is acceptable for canary (not a reproducible tier);
          # the in-place bump leaves the tree dirty, which `--no-git-checks`
          # on the publish step below handles.

      # Tier 3 — @latest version bump (changesets-driven).
      # Consumes changesets, bumps apps/cli/package.json, regenerates CHANGELOG.
      # Runs only when the channel is `latest`. The canary branch skips this
      # so changesets on staging stay available for the eventual main publish.
      - name: Bump versions
        if: steps.channel.outputs.version_source == 'changeset'
        run: pnpm changeset version
      - name: Refresh lockfile after bump
        if: steps.channel.outputs.version_source == 'changeset'
        run: pnpm install --frozen-lockfile

      # 1b. Build all packages that produce publishable artifacts.
      # Without this, `dist/` (the actual bundle) is missing from the
      # published tarball — see incident on 2026-08-03 where @deessejs/cli@1.1.0
      # shipped without its compiled bundle and `npx` couldn't find the bin.
      # `--filter ...build` excludes private packages (no dist to produce)
      # and runs each package's `build` script, including transitive deps.
      - name: Build publishable packages
        run: pnpm --filter "@deessejs/cli" --filter "@workspace/contracts" build

      # 2. Publish to npm.
      #
      # Tier 3 (@latest): `pnpm changeset publish` defaults to the `latest`
      # dist-tag with provenance triple-belt (publishConfig.provenance + env
      # var + --provenance if supported).
      #
      # Tier 2 (@canary): `npm publish --tag canary --provenance --no-git-checks`.
      # Three flags are load-bearing:
      #   --tag canary     without it, npm moves the `latest` tag to the new
      #                    version and silently un-`latest`s the previous stable.
      #   --provenance     belt-and-suspenders alongside `publishConfig.provenance: true`.
      #   --no-git-checks  suppresses npm's "dirty working tree" error caused
      #                    by the synthetic version bump above.
      # We deliberately bypass `pnpm changeset publish` on the canary path —
      # outside changesets pre-release mode it publishes to `latest` regardless
      # of any --tag flag and refuses packages whose version was not bumped
      # via `changeset version`.
      - name: Publish to npm (latest)
        if: steps.channel.outputs.dist_tag == 'latest'
        env:
          NPM_CONFIG_PROVENANCE: true
        run: pnpm changeset publish

      - name: Publish to npm (canary)
        if: steps.channel.outputs.dist_tag == 'canary'
        env:
          NPM_CONFIG_PROVENANCE: true
        working-directory: apps/cli
        run: |
          npm publish \
            --tag canary \
            --provenance \
            --no-git-checks
          # Defensive: guarantee `latest` did not move.
          # Read the previous latest from the registry (not from the local
          # package.json, which now holds the synthetic canary version).
          PREVIOUS=$(npm view @deessejs/cli@latest version 2>/dev/null || echo "")
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "${{ steps.canary-version.outputs.canary_version }}" ]; then
            npm dist-tag add @deessejs/cli@${PREVIOUS} latest
            echo "Re-pinned @latest to ${PREVIOUS} as belt-and-suspenders."
          else
            echo "@latest unchanged; no defensive re-pin needed."
          fi

      # Post-publish restore. The canary rewrite (step above) leaves
      # apps/cli/package.json dirty (set to the synthetic canary version).
      # Without this step, the next canary run would compute
      # `<synthetic>-canary.<new-timestamp>.<new-sha>`, producing a
      # suffix chain that grows without bound. After the publish
      # succeeds, this step rewrites the file back to the committed
      # version (X.Y.Z). The published tarball is already on npm; only
      # the next canary run sees the clean base.
      - name: Restore apps/cli version after canary publish
        if: steps.channel.outputs.dist_tag == 'canary'
        working-directory: apps/cli
        run: |
          BASE=$(git show HEAD:apps/cli/package.json | jq -r '.version')
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          if [ "$CURRENT" = "$BASE" ]; then
            echo "Version already at base ($BASE); no restore needed."
            exit 0
          fi
          echo "Restoring apps/cli/package.json#version from $CURRENT to $BASE"
          jq --arg v "$BASE" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      # 3. Read the new CLI version.
      # On the @canary path, the post-publish restore step has reset
      # apps/cli/package.json#version to the base value, so reading the
      # file would yield the base instead of the synthetic canary
      # version. We use steps.canary-version.outputs.canary_version when
      # available, falling back to the file read on the @latest path.
      - name: Read new version
        id: version
        run: |
          if [ -n "${{ steps.canary-version.outputs.canary_version }}" ]; then
            VERSION="${{ steps.canary-version.outputs.canary_version }}"
          else
            VERSION=$(node -e "console.log(require('./apps/cli/package.json').version)")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 4. Tag + push tag (force-update for idempotency).
      # Tier 2 canary tags look like `release/v2.1.0-canary.20260821143022.a832a55`
      # — same convention as Tier 3, with the synthetic suffix. Tags are visible
      # in the GitHub Releases feed marked as prereleases via the
      # `prerelease` flag on the action below.
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "release/v${{ steps.version.outputs.version }}"
          git push --force origin "release/v${{ steps.version.outputs.version }}"

      # 5. GitHub Release.
      # `prerelease` is set from `steps.channel.outputs.release_type`, so
      # @canary releases are marked as prereleases in the Releases feed
      # (visually distinct from @latest stable releases). The tag and title
      # follow the same convention for both channels.
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release/v${{ steps.version.outputs.version }}
          name: "Release v${{ steps.version.outputs.version }}"
          prerelease: ${{ steps.channel.outputs.release_type == 'prerelease' }}
          generate_notes: true
          fail_on_unmatched_files: true

