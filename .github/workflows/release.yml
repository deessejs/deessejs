name: Release

# Senior release pattern: single workflow does version bump + npm publish +
# tag + GitHub Release in one job. Triggered by push to main whose commit
# message contains '.changeset' (the convention for commits that include
# changeset files), or by manual workflow_dispatch.
#
# First-ever publish of @deessejs/cli is manual from a maintainer's machine
# (npm has no "pending publisher" feature). See
# docs/engineering/reports/versioning/12-npm-setup-walkthrough.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write   # OIDC for npm trusted publisher

jobs:
  release:
    runs-on: ubuntu-latest      # GitHub-hosted only — trusted publishers don't support self-hosted
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '.changeset')
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 0. Configure git (changesets will commit on our behalf via `commit: true`)
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 1. Consume changesets → bump apps/cli version, regenerate CHANGELOG
      - name: Bump versions
        run: pnpm changeset version
      - run: pnpm install --frozen-lockfile

      # 2. Publish via trusted publisher (OIDC).
      # Note: changesets publish doesn't accept --provenance or --access flags.
      # We rely on `publishConfig.provenance: true` in apps/cli/package.json
      # + NPM_CONFIG_PROVENANCE=true env var as belt + suspenders.
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: true
        run: pnpm changeset publish

      # 3. Read the new CLI version
      - name: Read new version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./apps/cli/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 4. Tag + push tag (force-update for idempotency)
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "release/v${{ steps.version.outputs.version }}"
          git push --force origin "release/v${{ steps.version.outputs.version }}"

      # 5. GitHub Release
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release/v${{ steps.version.outputs.version }}
          name: "Release v${{ steps.version.outputs.version }}"
          generate_notes: true
          fail_on_unmatched_files: true
