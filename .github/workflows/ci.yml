name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint (oxlint, gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ADR-031 Phase 2: Oxlint is now the gate. Runs at the repo root
      # against .oxlintrc.json. --max-warnings=0 mirrors the strict gate
      # ESLint held in Phase 1.
      - run: pnpm run lint:oxlint -- --max-warnings=0
        continue-on-error: true
      - name: Capture oxlint output
        if: always()
        shell: bash
        run: |
          set +e
          pnpm run lint:oxlint > oxlint.out 2>&1
          OXLINT_EXIT=$?
          set -e
          echo "oxlint exit code: $OXLINT_EXIT"
          echo "---- last 200 lines of oxlint.out ----"
          tail -n 200 oxlint.out || true
          echo "---- summary ----"
          echo "errors:   $(grep -cE '^error' oxlint.out || true)"
          echo "warnings: $(grep -cE '^warning' oxlint.out || true)"
      - name: Upload oxlint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxlint-output
          path: oxlint.out
          retention-days: 14
          if-no-files-found: ignore

      # ADR-031 Phase 2: ESLint is now info-only. eslint-plugin-oxlint
      # auto-disables every ESLint rule that Oxlint covers, so this run
      # only catches the residual: sonarjs/cognitive-complexity, the four
      # no-restricted-syntax selectors, react/forbid-elements, and the
      # SonarJS rules Oxlint does not implement (no-collapsible-if,
      # no-nested-switch).
      - name: ESLint (info-only)
        shell: bash
        run: |
          set +e
          pnpm turbo lint --force > eslint.out 2>&1
          ESLINT_EXIT=$?
          set -e
          echo "eslint exit code: $ESLINT_EXIT"
          echo "---- last 200 lines of eslint.out ----"
          tail -n 200 eslint.out || true
          echo "---- summary ----"
          echo "errors:   $(grep -cE '^error' eslint.out || true)"
          echo "warnings: $(grep -cE '^warning' eslint.out || true)"
        continue-on-error: true
      - name: Upload ESLint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-output
          path: eslint.out
          retention-days: 14
          if-no-files-found: ignore

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      BETTER_AUTH_SECRET: ci-test-secret-which-is-long-enough-to-pass-the-32-char-validation
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXT_PUBLIC_APP_URL: https://ci.example.com
      # ADR-023: production superRefine gate requires PARENT_DOMAIN
      # for cross-subdomain cookie sharing. Stubbed in CI so the
      # gate passes; the real value is set on Vercel per the
      # changeset operational prerequisites.
      PARENT_DOMAIN: ci.example.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=web --force
      - run: pnpm turbo typecheck --force

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      BETTER_AUTH_SECRET: ci-test-secret-which-is-long-enough-to-pass-the-32-char-validation
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXT_PUBLIC_APP_URL: https://ci.example.com
      # ADR-028: every NEXT_PUBLIC_* URL var is checked against its schema
      # default by `scripts/env-check.ts` (Decision #5). CI stubs all
      # four so the production-mode gate passes; real values are set
      # on Vercel per `.env.example`.
      NEXT_PUBLIC_WEB_URL: https://ci.example.com
      NEXT_PUBLIC_DOCS_URL: https://ci-docs.example.com
      NEXT_PUBLIC_API_BASE_URL: https://ci-api.example.com
      # ADR-023: production superRefine gate requires PARENT_DOMAIN
      # for cross-subdomain cookie sharing. Stubbed in CI so the
      # gate passes; the real value is set on Vercel per the
      # changeset operational prerequisites.
      PARENT_DOMAIN: ci.example.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Env validation — fails fast if production invariants are violated
      # (DATABASE_URL required, BETTER_AUTH_SECRET >= 32 chars, etc.)
      - name: Validate env
        run: pnpm env:check
      - run: pnpm turbo build --force

  test-unit:
    name: Test (Unit)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-test-secret-which-is-long-enough-to-pass-the-32-char-validation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - run: pnpm turbo test

  test-integration:
    name: Test (Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      # 32+ char secret so @workspace/env/server schema validation passes
      # without depending on a CI secret. Production secrets are still
      # injected via ${{ secrets.* }} in deploy workflows.
      BETTER_AUTH_SECRET: ci-test-secret-which-is-long-enough-to-pass-the-32-char-validation
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      # ADR-017: the templates integration test hits the real
      # GitHub REST API. The standard `secrets.GITHUB_TOKEN`
      # grants 1000 req/min on the workflow run; without it, the
      # anonymous 60 req/h budget is exhausted in minutes. The
      # probe in `packages/api/tests/globalSetup.ts` reads the
      # rate limit and skips the test loudly when remaining
      # quota is below the threshold.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo build

      - name: Generate migrations
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Run integration tests
        run: pnpm turbo test --filter=@workspace/auth --filter=@workspace/api
