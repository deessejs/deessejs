name: CLI preview packages

# Per-PR ephemeral preview packages for @deessejs/cli via pkg.pr.new.
# Implements Tier 1 of the three-tier release plan.
#
# Each push to a PR targeting staging or main rebuilds the CLI tarball
# and uploads it to pkg.pr.new's registry (their own infrastructure, not
# npm). Reviewers can install the preview with the URL posted as a sticky
# comment on the PR.
#
# IMPORTANT: requires the pkg.pr.new GitHub App to be installed on
# deessejs/deessejs. See the inter-app-URL config implementation
# checklist, step 4.
#
# Security: this workflow does NOT touch npm. pkg.pr.new authenticates
# via its own GitHub App, separate from npm Trusted Publishing. We
# explicitly do NOT grant `id-token: write` — a compromise of this
# workflow's secrets cannot affect the @latest or @canary release paths.

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "apps/cli/**"
      - "apps/create-deesse-app/**"
      - "packages/contracts/**"
      - "packages/api/**"
      - ".github/workflows/cli-preview.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: pkg-pr-new-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Install pinned pkg-pr-new from the lockfile, never via npx/dl x.
      # The README explicitly warns against npx/pnpm dlx/yarn dlx in CI
      # because the tool's behavior must be reproducible across runs.
      # The version is pinned as a devDependency at the root; see
      # the inter-app-URL config implementation checklist.
      - run: pnpm install --frozen-lockfile

      # Build the CLI and its transitive workspace deps in topological
      # order via Turbo's dependsOn: ^build. We intentionally do NOT
      # run tests or lint — those are covered by ci.yml and the publish
      # path runs cli-publish-verify.yml separately on PRs.
      - name: Build CLI and workspace deps
        run: pnpm turbo build --filter=@deessejs/cli --filter=create-deesse-app

      # Upload the tarball to pkg.pr.new. Flags rationale:
      #   --pnpm         required for pnpm catalogs (see pnpm-workspace.yaml)
      #   --compact      short URL form (https://pkg.pr.new/...@<sha>)
      #   --bin          render `npx ...` in the PR comment instead of `npm i ...`
      #   --comment=off  the CLI's default behavior is to also post its own
      #                  sticky comment ("Open in StackBlitz" + npx). We
      #                  disable that and post our own richer comment
      #                  below (4 package managers, stable marker, link to
      #                  the commit). The check-run "Continuous Releases"
      #                  on the PR is independent of --comment and stays.
      #   --json output.json
      #                  machine-readable output for the comment step below
      - name: Publish CLI previews to pkg.pr.new
        # --no-compact forces explicit long-form URLs
        # (https://pkg.pr.new/<owner>/<repo>/<package>@<sha>) for
        # both packages. The first npm release for
        # create-deesse-app does not exist yet, so the default
        # compact-mode resolution against npm metadata would fall
        # back to long form anyway; we use --no-compact to make
        # the intent explicit and not depend on that fallback.
        run: |
          pnpm exec pkg-pr-new publish \
            ./apps/cli \
            ./apps/create-deesse-app \
            --pnpm --no-compact --bin --comment=off --json output.json

      # Smoke test the published create-deesse-app preview.
      #
      # We read the package URL out of output.json (which the
      # publish step just wrote) instead of rebuilding it, so a
      # publishing bug surfaces as a smoke failure too. We test
      # two launchers: npx (the comment's default for npm
      # users) and pnpm dlx (the default for pnpm users and
      # the launcher rendered open in the PR comment). For
      # each we run --version (a one-line check that the
      # binary starts and reports the right version) and
      # --help (a few lines of output, enough to confirm
      # commander parsed the flags).
      #
      # The smoke runs in a throwaway mktemp directory so the
      # workspace's root package.json (catalog: strict,
      # workspace:* devdeps) does not pollute the install.
      # npx and pnpm dlx both reach out to pkg.pr.new; the
      # runner has network access. The 60s timeout is a
      # belt-and-braces guard against a hung install.
      - name: Smoke test create-deesse-app preview
        env:
          # The version of create-deesse-app at the time of
          # this PR is 0.0.0. The tsup build inlines
          # process.env.CREATE_DEESSE_APP_VERSION into the
          # bundle, so the --version banner reports exactly
          # this string. When the package gets a real
          # release, this expectation will need to follow
          # the published version.
          EXPECTED_VERSION: "0.0.0"
        run: |
          set -euo pipefail
          URL=$(node -e '
            const fs = require("node:fs");
            const o = JSON.parse(fs.readFileSync("output.json", "utf8"));
            const p = o.packages.find(x => x.name === "create-deesse-app");
            if (!p) { console.error("create-deesse-app missing from output.json packages:", o.packages.map(x => x.name)); process.exit(1); }
            process.stdout.write(p.url);
          ')
          echo "create-deesse-app preview URL: $URL"
          WORK=$(mktemp -d)
          cd "$WORK"
          echo "--- npx --version ---"
          timeout 60 npx --yes "$URL" --version
          echo "--- npx --help (first 5 lines) ---"
          timeout 60 npx --yes "$URL" --help | head -5
          echo "--- pnpm dlx --version ---"
          timeout 60 pnpm dlx --silent "$URL" --version
          echo "--- pnpm dlx --help (first 5 lines) ---"
          timeout 60 pnpm dlx --silent "$URL" --help | head -5
          rm -rf "$WORK"
        shell: bash

      # Post or update the sticky PR comment. Mirrors the sanity-io/next-sanity
      # pattern: find any existing comment with the marker, edit it if found,
      # create it otherwise. The marker `<!-- pkg-pr.new -->` is stable so
      # future workflow changes can detect prior comments.
      #
      # FORK NOTE: a PR from a fork runs with a read-only
      # GITHUB_TOKEN and may not have permission to write
      # comments. pkg.pr.new's own comment (the
      # "Continuous Releases" check-run) is unaffected
      # because the pkg.pr.new GitHub App authenticates
      # separately. A maintainer must approve the fork
      # workflow run (Settings > Actions > Fork pull
      # request workflows > Require approval for first-time
      # contributors) for this step to land.
      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const output = JSON.parse(fs.readFileSync('output.json', 'utf8'))

            const PACKAGE_MANAGERS = [
              { name: 'pnpm', installCommand: 'pnpm dlx' },
              { name: 'npm', installCommand: 'npx' },
              { name: 'yarn', installCommand: 'yarn dlx' },
              { name: 'bun', installCommand: 'bunx' },
            ]

            const BOT_COMMENT_IDENTIFIER = '<!-- pkg.pr.new -->'
            const BACKTICKS = '```'

            function renderPackages(pkgManager, pkgs) {
              return pkgs
                .map(
                  (pkg) =>
                    `##### :package: \`${pkg.name}\`\n${BACKTICKS}sh\n${pkgManager.installCommand} ${pkg.url}\n${BACKTICKS}\n`,
                )
                .join('\n')
            }

            function renderInstallInstructions() {
              return PACKAGE_MANAGERS.map(
                (pkgManager) =>
                  `<details${pkgManager.name === 'pnpm' ? ' open' : ''}>\n<summary>Using ${pkgManager.name}</summary>\n\n${renderPackages(pkgManager, output.packages)}\n</details>\n`,
              ).join('\n')
            }

            const sha = context.payload.pull_request?.head?.sha ?? context.sha

            const body = `## Preview this PR with [pkg.pr.new](https://pkg.pr.new)\n\n${renderInstallInstructions()}\n[View commit](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}) (${sha})\n${BOT_COMMENT_IDENTIFIER}\n`

            async function findBotComment(issueNumber) {
              if (!issueNumber) return null
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              })
              return comments.data.find((comment) => comment.body.includes(BOT_COMMENT_IDENTIFIER))
            }

            async function createOrUpdateComment(issueNumber) {
              if (!issueNumber) {
                console.log('No issue number provided. Cannot post or update comment.')
                return
              }
              const existingComment = await findBotComment(issueNumber)
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  issue_number: issueNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                })
              }
            }

            if (context.eventName === 'pull_request') {
              await createOrUpdateComment(context.issue.number)
            } else {
              throw new Error('This job can only run for pull requests')
            }
