name: Staging canary

# Per ADR-025: every push to staging publishes a @canary build automatically.
# This workflow is a thin wrapper that calls release.yml via workflow_call
# with channel=canary. The actual publish job lives in release.yml because
# npm Trusted Publishing allows only one trusted publisher per package, and
# the trusted publisher is configured against release.yml's path. See
# docs/engineering/decisions/ADR-025-auto-canary-on-staging.mdx for the
# design rationale.
#
# Concurrency is keyed on the commit SHA so two pushes to the same SHA do
# not double-publish. cancel-in-progress: false because a canary publish
# has external side effects (npm tag, GitHub Release) that should not be
# cut short mid-flight.
#
# Permissions: id-token: write is required because the called workflow
# (release.yml) requests OIDC for npm Trusted Publishing. This wrapper
# inherits the OIDC token via workflow_call's secrets: inherit.

on:
  push:
    branches: [staging]

concurrency:
  group: staging-canary-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  canary:
    uses: ./.github/workflows/release.yml
    with:
      channel: canary
    secrets: inherit
