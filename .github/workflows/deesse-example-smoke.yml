name: Deesse Next example smoke

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/deesse/**"
      - "apps/deesse-drizzle-adapter/**"
      - "examples/next-shadcn-monorepo/**"
      - ".github/workflows/deesse-example-smoke.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"

permissions:
  contents: read

jobs:
  next-example:
    name: Next example PostgreSQL smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: deesse_next_smoke
          POSTGRES_PASSWORD: local_smoke_only
          POSTGRES_USER: deesse_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deesse_smoke -d deesse_next_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://deesse_smoke:local_smoke_only@127.0.0.1:5432/deesse_next_smoke
      BETTER_AUTH_SECRET: local-smoke-only-secret-that-is-long-enough
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the Deesse adapter CLI before schema generation
        run: pnpm turbo build --filter=@deessejs/drizzle-adapter
      - name: Generate schemas without a reachable database
        working-directory: examples/next-shadcn-monorepo/apps/web
        env:
          DATABASE_URL: postgres://unreachable:unreachable@127.0.0.1:1/unreachable
        run: pnpm run schema:generate
      - name: Verify generated source and migration are committed and current
        run: |
          set -euo pipefail
          pnpm --filter @deesse-example/web exec drizzle-kit check --config ./drizzle.config.ts
          pnpm --filter @deesse-example/web db:generate
          generated_paths="examples/next-shadcn-monorepo/apps/web/src/server/database/schema examples/next-shadcn-monorepo/apps/web/drizzle"
          if [ -n "$(git status --porcelain -- $generated_paths)" ]; then
            echo "Generated schema or migration output changed. Review and commit it explicitly." >&2
            git status --short -- $generated_paths
            git diff -- $generated_paths
            exit 1
          fi
      - name: Build the Next.js example and its workspace dependencies
        run: pnpm turbo build --filter=@deesse-example/web...
      - name: Apply reviewed example migration
        run: pnpm --filter @deesse-example/web db:migrate
      - name: Capture migrated PostgreSQL schema
        run: |
          set -euo pipefail
          pnpm --filter @deesse-example/web exec node ./scripts/schema-snapshot.mjs > "$RUNNER_TEMP/deesse-schema-before.json"
      - name: Start Next app and verify startup performs no DDL
        shell: bash
        run: |
          set -euo pipefail
          setsid pnpm --filter @deesse-example/web start > "$RUNNER_TEMP/deesse-next.log" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            kill -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            cat "$RUNNER_TEMP/deesse-next.log"
            return "$status"
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/deesse-next.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/deesse-next.log"; exit 1; fi
          probe_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:3000/api/__deesse_startup_probe?probe=1')"
          if [ "$probe_status" != "404" ]; then
            echo "Expected the Deesse startup probe to reach the initialized Hono app and return 404, got $probe_status" >&2
            cat "$RUNNER_TEMP/deesse-next.log"
            exit 1
          fi
          pnpm --filter @deesse-example/web exec node ./scripts/schema-snapshot.mjs > "$RUNNER_TEMP/deesse-schema-after.json"
          if ! diff -u "$RUNNER_TEMP/deesse-schema-before.json" "$RUNNER_TEMP/deesse-schema-after.json"; then
            echo "PostgreSQL schema catalog changed during Next startup" >&2
            cat "$RUNNER_TEMP/deesse-next.log"
            exit 1
          fi
          pnpm --filter @deesse-example/web smoke
          pnpm --filter @deesse-example/web exec node ./scripts/schema-snapshot.mjs > "$RUNNER_TEMP/deesse-schema-after-smoke.json"
          if ! diff -u "$RUNNER_TEMP/deesse-schema-after.json" "$RUNNER_TEMP/deesse-schema-after-smoke.json"; then
            echo "PostgreSQL schema catalog changed during the example smoke journey" >&2
            exit 1
          fi
