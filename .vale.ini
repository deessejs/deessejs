StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = DeesseJS
Packages = write-good, proselint, Microsoft

[*.md]
BasedOnStyles = Vale, write-good, proselint, Microsoft

# Token-scoped ignores for non-prose tokens that frequently trigger false positives.
# Each entry is a regex matched against inline (token-level) content.
#
# The URL pattern excludes backticks on purpose. A greedy `\S+` consumes the
# closing backtick of an inline-code span (`https://host/api/x`), which
# desynchronises Vale's inline-code pairing and makes it lint the *following*
# code spans as prose.
TokenIgnores = (?i)@[\w-]+, https?://[^\s`]+

# Block-scoped ignores for embedded content that Vale should not lint.
# YAML frontmatter and fenced code blocks are common offenders.
#
# HTML comments are deliberately NOT ignored here: an `(?s)<!--[\s\S]*?-->`
# entry also swallows Vale's own `<!-- vale off -->` / `<!-- vale on -->`
# markers, which makes it impossible to exempt verbatim quoted material
# (upstream docs, changelog excerpts) from style rules.
BlockIgnores = (?s)```[\s\S]*?```, (?s)---[\s\S]*?---
