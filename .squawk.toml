# Squawk config for the deessejs monorepo.
# See https://github.com/sbdchd/squawk/blob/master/docs/docs/cli.md
#
# Postgres version matches the GitHub Actions test-integration
# service (postgres:16-alpine) and the staging DB.
pg_version = "16.0"

# Excluded rules. Each rule below is excluded for a structural
# reason documented inline; do not remove a row without a written
# rationale (the rationale belongs in the inline comment).
# Squawk has no warning-vs-error exit-code distinction today
# (sbdchd/squawk#348 is open with no resolution), so each rule
# is either active (fails CI) or excluded by name.
#
# The destructive- and renaming-shaped rules are kept active:
# drizzle-kit generate emits these patterns correctly, and the
# expand-and-contract gate (see the drizzle-migrations-ci notes
# on Nuclino) needs to catch them.
excluded_rules = [
  # drizzle-kit wraps every migration in a single transaction,
  # and Postgres rejects CREATE INDEX CONCURRENTLY inside a
  # transaction block (drizzle-team/drizzle-orm#860 has been
  # open since 2022). Until the migrator exposes a per-file
  # opt-out, Squawk's warning is a false positive. Workaround
  # when a non-blocking index is genuinely needed: a raw SQL
  # migration run outside the migrator.
  "require-concurrent-index-creation",
  "require-concurrent-index-deletion",

  # Senior pattern is ADD CONSTRAINT ... NOT VALID in one
  # transaction and VALIDATE CONSTRAINT in a second, which a
  # single drizzle-kit-generated transaction cannot express.
  # The reduce-the-cost-on-populated-tables motivation does
  # not apply to the small tables in this repo.
  "adding-foreign-key-constraint",
  "constraint-missing-not-valid",

  # Generated migrations may lack IF NOT EXISTS / IF EXISTS;
  # the Drizzle journal already guards against re-application,
  # which is what this rule covers for hand-written SQL.
  "prefer-robust-stmts",

  # Per-migration lock_timeout/statement_timeout is for
  # hand-written DDL run during live traffic. This repo's
  # migrations run in a deployment-controlled DDL session.
  "require-timeout-settings",

  # The repo's existing tables (user, session, account,
  # verification) all use plain `timestamp` columns. The
  # deviceCode table added by the device-authorization flow
  # follows the same convention. Migrating the existing tables to
  # `timestamptz` is a separate, larger piece of work that
  # requires backfilling timezone-aware values and updating
  # every consumer that does date math; it does not belong in
  # the device-flow PR. Until that migration lands, the rule
  # is excluded to keep the schema consistent across tables.
  "prefer-timestamp-tz",

  # Better Auth 1.7.7's CLI emits `integer` for `pollingInterval`.
  # The plugin's `schema` option is typed for column renames, not
  # types, so no per-field type override is available without a
  # Better Auth upgrade. The runtime value range fits in
  # `integer`; Squawk's rule is a style/safety guard for
  # monotonic counters, not a correctness requirement. Tracked
  # as follow-up: revisit when Better Auth exposes a supported
  # type-override API.
  "prefer-bigint-over-int",
]
